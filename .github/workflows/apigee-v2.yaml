name: Reusable Apigee CI/CD

on:
  workflow_call:
    inputs:
      apigee_org:
        required: true
        type: string

      apigee_env:
        required: true
        type: string

      deploy_proxy:
        required: true
        type: string

      resourcetype:
        required: true
        type: string

      node_version:
        required: false
        default: '18'
        type: string

      branch_name:
        required: false
        type: string

      cicd_config_url:
        required: false
        default: 'https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config'
        type: string

      version:
        required: false
        default: ''
        type: string

    secrets:
      CICD_PROFILE_ID:
        required: true
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      PROB_SERVICE_TOKEN_URL:
        required: true
      PROB_SERVICE_TOKEN_CLIENT_ID:
        required: true
      PROB_SERVICE_TOKEN_CLIENT_SECRET:
        required: true
      PROB_SERVICE_TOKEN_TENANT_ID:
        required: true
      FLOW_CHANGE_ID:
        required: true
      RESOURCE_ID:
        required: true
      FLOW_TYPE:
        required: true
      TOKEN_ISSUER_URL:
        required: false

permissions:
  contents: read

env:
  RESOURCE_TYPE: ${{ inputs.resourcetype }}
  BUNDLE_DIR: ${{ inputs.resourcetype == 'apis' && 'apiproxy' || 'sharedflowbundle' }}
  LOG_BUFFER_SIZE: '50'
  LOG_FLUSH_INTERVAL: '2'
  LOG_REQUEST_TIMEOUT: '10'
  LOG_DRAIN_TIMEOUT: '5'

  PIPELINE_LOGS_URL: 'https://forgesphere.probestack.io/pipeline-logs'
  TOKEN_ISSUER_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  ORGANIZATION_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
  FLOW_CHANGE_ID: ${{ secrets.FLOW_CHANGE_ID != '' && secrets.FLOW_CHANGE_ID || github.run_id }}
  PL_PIPELINE_TYPE: ${{ secrets.FLOW_TYPE }}

jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      # ===================================================
      # SETUP
      # ===================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template
      
      - name: Resolve Flow Change ID
        id: flow-change-id
        shell: bash
        env:
          RAW_FLOW_CHANGE_ID: ${{ secrets.FLOW_CHANGE_ID }}
          CURRENT_SHA:        ${{ github.sha }}
          CURRENT_BRANCH:     ${{ github.ref_name }}
        run: |
          set -euo pipefail

          RESOLVED=""

          # Case 1: composite "<uuid>:<sha>:<branch>" (the format emitted
          # by the ForgeSphere onboarding flow).
          if [[ "$RAW_FLOW_CHANGE_ID" =~ ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}):([0-9a-fA-F]+):(.+)$ ]]; then
            RAW_UUID="${BASH_REMATCH[1]}"
            RAW_SHA="${BASH_REMATCH[2]}"
            RAW_BRANCH="${BASH_REMATCH[3]}"

            SHA_MATCH=0
            if [[ "$RAW_SHA" == "$CURRENT_SHA" ]]; then
              SHA_MATCH=1
            elif [[ "$CURRENT_SHA" == "$RAW_SHA"* ]]; then
              # Accept short SHA matching the prefix of the full SHA.
              SHA_MATCH=1
            fi

            if [[ "$SHA_MATCH" == "1" && "$RAW_BRANCH" == "$CURRENT_BRANCH" ]]; then
              RESOLVED="$RAW_UUID"
              echo "Reusing existing flow change ID (sha and branch match this run)"
            else
              echo "SHA or branch mismatch; generating a new flow change ID"
              echo "  expected sha/branch: $CURRENT_SHA / $CURRENT_BRANCH"
              echo "  supplied sha/branch: $RAW_SHA / $RAW_BRANCH"
            fi

          # Case 2: bare UUID supplied directly.
          elif [[ "$RAW_FLOW_CHANGE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            RESOLVED="$RAW_FLOW_CHANGE_ID"
            echo "Using supplied bare UUID as flow change ID"

          # Case 3: empty, a raw run_id, or anything else → generate new.
          else
            echo "No reusable flow change ID supplied; generating a new one"
          fi

          if [[ -z "$RESOLVED" ]]; then
            if command -v uuidgen >/dev/null 2>&1; then
              RESOLVED="$(uuidgen | tr '[:upper:]' '[:lower:]')"
            else
              RESOLVED="$(python3 -c 'import uuid; print(uuid.uuid4())')"
            fi
          fi

          echo "Resolved FLOW_CHANGE_ID=$RESOLVED"
          echo "FLOW_CHANGE_ID=$RESOLVED" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install tools
        shell: bash
        env:
          LOG_STAGE: SETUP
          LOG_STEP: INSTALL_TOOLS
        run: |
          set -o pipefail

          (
            set -euo pipefail
            echo "Installing jq, unzip and zip..."
            sudo apt-get update
            sudo apt-get install -y jq unzip zip
            echo "Required tools installed successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Force GitHub auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOG_STAGE: SETUP
          LOG_STEP: GITHUB_AUTH
        run: |
          set -o pipefail

          (
            set -euo pipefail

            git config --global \
              url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
              "https://github.com/"

            echo "GitHub authentication configuration completed"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # VALIDATION
      # ===================================================
      - name: Validate Resource Type
        shell: bash
        env:
          LOG_STAGE: VALIDATION
          LOG_STEP: VALIDATE_RESOURCE_TYPE
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [[ "${{ inputs.resourcetype }}" != "apis" &&
                  "${{ inputs.resourcetype }}" != "sharedflows" ]]; then
              echo "ERROR: Invalid resourcetype: ${{ inputs.resourcetype }}"
              exit 1
            fi

            echo "Resource type: ${{ inputs.resourcetype }}"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Validate release.properties
        shell: bash
        env:
          LOG_STAGE: VALIDATION
          LOG_STEP: VALIDATE_RELEASE_PROPERTIES
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ ! -f release.properties ]; then
              echo "ERROR: release.properties not found"
              exit 1
            fi

            if ! grep -q '^version=' release.properties; then
              echo "ERROR: version property not found"
              exit 1
            fi

            BASE_VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)
            echo "Base version: $BASE_VERSION"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # FORGESPHERE CONFIGURATION
      # ===================================================
      - name: Get ForgeSphere Service Token
        id: service-token
        shell: bash
        env:
          PROB_SERVICE_TOKEN_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
          PROB_SERVICE_TOKEN_CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
          PROB_SERVICE_TOKEN_CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
          PROB_SERVICE_TOKEN_TENANT_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
          LOG_STAGE: FORGESPHERE_CONFIGURATION
          LOG_STEP: GET_SERVICE_TOKEN
        run: |
          set -o pipefail

          (
            set -euo pipefail

            echo "Requesting ForgeSphere service token..."
            python3 pipeline-template/scripts/get_service_token.py

            if [ -z "${GITHUB_OUTPUT:-}" ]; then
              echo "ERROR: GITHUB_OUTPUT is not available"
              exit 1
            fi

            echo "ForgeSphere service token generated successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Load ForgeSphere CI/CD Configuration
        id: config
        shell: bash
        env:
          CICD_CONFIG_URL: ${{ inputs.cicd_config_url }}
          CICD_CONFIG_ID: ${{ secrets.CICD_PROFILE_ID }}
          SERVICE_ACCESS_TOKEN: ${{ steps.service-token.outputs.access_token }}
          DEPLOY_PROXY: ${{ inputs.deploy_proxy }}
          RESOURCE_TYPE: ${{ inputs.resourcetype }}
          ENVIRONMENT: ${{ inputs.apigee_env }}
          LOG_STAGE: FORGESPHERE_CONFIGURATION
          LOG_STEP: LOAD_CICD_CONFIG
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -z "${SERVICE_ACCESS_TOKEN:-}" ]; then
              echo "ERROR: ForgeSphere service token is empty"
              exit 1
            fi

            python3 pipeline-template/scripts/load_cicd_configs.py
            echo "ForgeSphere CI/CD configuration processed successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # OPTIONAL GITHUB APP TOKEN
      # ===================================================
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Select Token
        id: token-select
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOG_STAGE: SETUP
          LOG_STEP: SELECT_GITHUB_TOKEN
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -n "${APP_TOKEN:-}" ]; then
              echo "Using GitHub App token"
              echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            else
              echo "Using GH_TOKEN"
              echo "token=${GH_TOKEN}" >> "$GITHUB_OUTPUT"
            fi
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # LINT
      # ===================================================
      - name: Checkout lint rules
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ steps.token-select.outputs.token }}

      - name: Apigee Lint
        continue-on-error: true
        shell: bash
        env:
          LOG_STAGE: LINT
          LOG_STEP: APIGEE_LINT
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -d "./apigee-linting-custom" ]; then
              npx apigeelint \
                -s "$BUNDLE_DIR" \
                -x ./apigee-linting-custom/rules \
                -f table.js
            else
              echo "Skipping Apigee lint"
            fi
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: JS Lint
        continue-on-error: true
        shell: bash
        env:
          LOG_STAGE: LINT
          LOG_STEP: JS_LINT
        run: |
          set -o pipefail

          (
            set -euo pipefail
            npx jslint "$BUNDLE_DIR"/**/*.js
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Sonar Scan
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ steps.config.outputs.sonar_host_url }}
          SONAR_TOKEN: ${{ steps.config.outputs.sonar_token }}
          SONAR_PROJECT_KEY: ${{ steps.config.outputs.sonar_project_key }}
          LOG_STAGE: SONAR
          LOG_STEP: SONAR_SCAN
        shell: bash
        run: |
          set -o pipefail

          (
            set -euo pipefail

            echo "Running SonarQube scan"

            npx sonarqube-scanner \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.sources="$BUNDLE_DIR"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # VERSION
      # ===================================================
      - name: Calculate Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          LOG_STAGE: VERSION
          LOG_STEP: CALCULATE_VERSION
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -n "$INPUT_VERSION" ]; then
              VERSION="$INPUT_VERSION"
            else
              BASE_VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)
              SHORT_SHA=$(git rev-parse --short HEAD)
              VERSION="${BASE_VERSION}-${SHORT_SHA}"
            fi

            echo "Version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # PACKAGE
      # ===================================================
      - name: Package Proxy
        shell: bash
        env:
          LOG_STAGE: PACKAGE
          LOG_STEP: PACKAGE_PROXY
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ "${{ inputs.resourcetype }}" = "apis" ]; then
              ZIP_FILE="proxy.zip"
            else
              ZIP_FILE="sharedflowbundle.zip"
            fi

            echo "RESOURCE_TYPE=$RESOURCE_TYPE"
            echo "BUNDLE_DIR=$BUNDLE_DIR"
            echo "ZIP_FILE=$ZIP_FILE"

            test -d "$BUNDLE_DIR"
            zip -r "$ZIP_FILE" "$BUNDLE_DIR"

            ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"
            cp "$ZIP_FILE" "$ARTIFACT_NAME"

            echo "========================================"
            echo "ZIP CREATED"
            echo "Artifact: $ARTIFACT_NAME"
            echo "Version : ${{ steps.version.outputs.version }}"
            echo "========================================"

            ls -lh "$ZIP_FILE" "$ARTIFACT_NAME"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # NEXUS PUSH
      # ===================================================
      - name: Push Package to Nexus
        if: |
          steps.config.outputs.nexus_url != '' &&
          steps.config.outputs.merge_branch == inputs.branch_name
        shell: bash
        env:
          NEXUS_URL: ${{ steps.config.outputs.nexus_url }}
          NEXUS_REPOSITORY: ${{ steps.config.outputs.nexus_repository }}
          NEXUS_USERNAME: ${{ steps.config.outputs.nexus_username }}
          NEXUS_PASSWORD: ${{ steps.config.outputs.nexus_password }}
          LOG_STAGE: NEXUS
          LOG_STEP: PUSH_PACKAGE
        run: |
          set -o pipefail

          (
            set -euo pipefail

            ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"
            VERSION="${{ steps.version.outputs.version }}"

            if [ ! -f "$ARTIFACT_NAME" ]; then
              echo "ERROR: Package not found: $ARTIFACT_NAME"
              exit 1
            fi

            if [ -z "$NEXUS_REPOSITORY" ]; then
              echo "ERROR: Nexus repository not configured"
              exit 1
            fi

            UPLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${{ inputs.deploy_proxy }}/${VERSION}/${ARTIFACT_NAME}"

            echo "NEXUS UPLOAD"
            echo "Host       : ${NEXUS_URL%/}"
            echo "Repository : $NEXUS_REPOSITORY"
            echo "Artifact   : $ARTIFACT_NAME"
            echo "Version    : $VERSION"

            curl \
              --fail \
              --show-error \
              --silent \
              --user "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
              --upload-file "$ARTIFACT_NAME" \
              "$UPLOAD_URL"

            echo "Nexus upload successful"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Nexus not configured
        if: steps.config.outputs.nexus_url == ''
        shell: bash
        env:
          LOG_STAGE: NEXUS
          LOG_STEP: NEXUS_NOT_CONFIGURED
        run: |
          set -o pipefail

          (
            echo "Nexus configuration not available from ForgeSphere"
            echo "Skipping Nexus upload"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # APIGEE TOKEN SERVICE AUTH
      # ===================================================
      - name: Authenticate GitHub to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.apigee_workload_identity_provider }}
          service_account: ${{ steps.config.outputs.apigee_serviceAccountEmail }}
          token_format: access_token
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Verify authentication
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          LOG_STAGE: GCP_AUTH
          LOG_STEP: VERIFY_AUTHENTICATION
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -z "$ACCESS_TOKEN" ]; then
              echo "ERROR: Access token was not generated"
              exit 1
            fi

            echo "Apigee access token generated successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # IMPORT
      # ===================================================
      - name: Import Proxy
        shell: bash
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          LOG_STAGE: IMPORT
          LOG_STEP: IMPORT_PROXY
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ "${{ inputs.resourcetype }}" = "apis" ]; then
              ZIP_FILE="proxy.zip"
            else
              ZIP_FILE="sharedflowbundle.zip"
            fi

            URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}?action=import&name=${{ inputs.deploy_proxy }}"

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --write-out "\nHTTP_STATUS:%{http_code}\n" \
                -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -F "file=@$ZIP_FILE" \
                "$URL"
            )"

            STATUS="$(
              echo "$RESPONSE" |
              grep HTTP_STATUS |
              cut -d':' -f2
            )"

            if [ "$STATUS" -ne 200 ]; then
              echo "Import failed"
              echo "$RESPONSE"
              exit 1
            fi

            echo "Import successful"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # GET REVISION
      # ===================================================
      - name: Get Latest Revision
        id: revision
        shell: bash
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          LOG_STAGE: REVISION
          LOG_STEP: GET_LATEST_REVISION
        run: |
          set -o pipefail

          (
            set -euo pipefail

            REV="$(
              curl \
                --silent \
                --show-error \
                -H "Authorization: Bearer $TOKEN" \
                "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions" |
              jq -r 'map(tonumber) | max'
            )"

            if [ -z "$REV" ] || [ "$REV" = "null" ]; then
              echo "Unable to determine revision"
              exit 1
            fi

            echo "revision=$REV" >> "$GITHUB_OUTPUT"
            echo "Latest revision: $REV"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # DEPLOY
      # ===================================================
      - name: Deploy Proxy
        shell: bash
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          SERVICE_ACCOUNT_FILE: ${{ steps.config.outputs.apigee_serviceAccountFile }}
          SERVICE_ACCOUNT: ${{ steps.config.outputs.apigee_serviceAccountEmail }}
          LOG_STAGE: DEPLOYMENT
          LOG_STEP: DEPLOY_PROXY
        run: |
          set -o pipefail

          (
            set -euo pipefail

            BASE_URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments"

            if [ ! -f "$SERVICE_ACCOUNT_FILE" ]; then
              echo "ERROR: Apigee service account file not found:"
              echo "$SERVICE_ACCOUNT_FILE"
              exit 1
            fi

            SERVICE_ACCOUNT_EMAIL="$(
              jq -r '.client_email // empty' "$SERVICE_ACCOUNT_FILE"
            )"

            if [ -z "$SERVICE_ACCOUNT_EMAIL" ]; then
              echo "ERROR: client_email missing from Apigee service account JSON"
              exit 1
            fi

            echo "Apigee service account: $SERVICE_ACCOUNT_EMAIL"

            SERVICE_ACCOUNT_QUERY="$(
              printf '%s' "$SERVICE_ACCOUNT_EMAIL" |
              jq -sRr @uri
            )"

            URL="${BASE_URL}?serviceAccount=${SERVICE_ACCOUNT_QUERY}"
            BODY='{ "override": true }'

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --write-out "\nHTTP_STATUS:%{http_code}\n" \
                -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                --data "$BODY" \
                "$URL"
            )"

            STATUS="$(
              echo "$RESPONSE" |
              grep HTTP_STATUS |
              cut -d':' -f2
            )"

            if [ "$STATUS" -ne 200 ]; then
              echo "Deployment failed"
              echo "$RESPONSE"
              exit 1
            fi

            echo "Deployment successful"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # VERIFY
      # ===================================================
      - name: Verify Deployment
        shell: bash
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          LOG_STAGE: VERIFY
          LOG_STEP: VERIFY_DEPLOYMENT
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -z "$TOKEN" ]; then
              echo "ERROR: Google Cloud access token is empty"
              exit 1
            fi

            STATUS="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}"
            )"

            if [ "$STATUS" != "200" ]; then
              echo "Proxy verification failed with HTTP status $STATUS"
              exit 1
            fi

            echo "Proxy verified successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # CLEANUP
      # ===================================================
      - name: Cleanup CI/CD configuration
        if: always()
        shell: bash
        env:
          LOG_STAGE: CLEANUP
          LOG_STEP: CLEANUP
        run: |
          set -o pipefail

          (
            rm -f \
              apigee-config.json \
              cicd-config.json \
              proxy.zip \
              sharedflowbundle.zip

            echo "Temporary configuration removed"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ===================================================
      # FINAL EXECUTION STATUS
      # ===================================================
      - name: Update execution status
        if: always()
        shell: bash
        env:
          LOG_STAGE: EXECUTION
          LOG_STEP: FINAL_STATUS
        run: |
          FINAL_STATUS="${{ job.status }}"

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$FINAL_STATUS" \
            --message "GitHub Actions execution completed with status: $FINAL_STATUS" || true

          exit 0