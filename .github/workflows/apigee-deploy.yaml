name: Apigee Deploy (Service Account Key)

on:
  workflow_dispatch:
    inputs:
      apigee_org:
        required: true
      apigee_env:
        required: true
      deploy_proxy:
        required: true
      zip_url:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Install dependencies
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # Write JSON key from secret
      - name: Create Service Account File
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > key.json

      # Authenticate
      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account \
            --key-file=key.json

      # Get token (AUTOMATED every run)
      - name: Get Access Token
        id: token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # Download proxy
      - name: Download Proxy
        run: |
          curl -L -o proxy.zip "${{ inputs.zip_url }}"

      # Extract
      - name: Extract Proxy
        run: |
          unzip proxy.zip -d extracted
          ls -R extracted

      # Locate apiproxy
      - name: Locate apiproxy
        id: locate
        run: |
          PROXY_DIR=$(find extracted -type d -name apiproxy | head -n 1)

          if [ -z "$PROXY_DIR" ]; then
            echo "apiproxy not found"
            exit 1
          fi

          echo "proxy_dir=$PROXY_DIR" >> $GITHUB_OUTPUT

      # Package correctly
      - name: Package Proxy
        run: |
          cd $(dirname "${{ steps.locate.outputs.proxy_dir }}")
          zip -r proxy.zip apiproxy
          mv proxy.zip $GITHUB_WORKSPACE/

      # Import proxy
      - name: Import Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F file=@proxy.zip \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis?action=import&name=${{ inputs.deploy_proxy }}")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            exit 1
          fi

      # Get revision
      - name: Get Revision
        id: revision
        run: |
          REV=$(curl -s -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
          "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}/revisions" \
          | jq -r 'map(tonumber) | max')

          echo "revision=$REV" >> $GITHUB_OUTPUT

      # Deploy
      - name: Deploy Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data '{ "override": true }' \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/apis/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            exit 1
          fi

      # Verify
      - name: Verify
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "Proxy not found"
            exit 1
          fi

          echo "Deployment successful"
