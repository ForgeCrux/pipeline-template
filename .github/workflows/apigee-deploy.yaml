name: Apigee Deploy Only Pipeline

on:
  workflow_dispatch:
    inputs:
      apigee_org:
        description: "Apigee Organization"
        required: true
        type: string
      apigee_env:
        description: "Apigee Environment"
        required: true
        type: string
      deploy_proxy:
        description: "Proxy Name"
        required: true
        type: string
      zip_url:
        description: "Proxy bundle ZIP URL"
        required: true
        type: string

  workflow_call:
    inputs:
      apigee_org:
        required: true
        type: string
      apigee_env:
        required: true
        type: string
      deploy_proxy:
        required: true
        type: string
      zip_url:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Install tools
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # Authenticate to GCP
      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WL_IDENTITY }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          token_format: access_token

      # Download proxy ZIP
      - name: Download Proxy Bundle
        run: |
          curl -L -o proxy.zip "${{ inputs.zip_url }}"

      # Extract ZIP
      - name: Extract Proxy Bundle
        run: |
          unzip proxy.zip -d extracted
          echo "Extracted files:"
          ls -R extracted

      # Locate apiproxy folder
      - name: Locate apiproxy
        id: locate
        run: |
          PROXY_DIR=$(find extracted -type d -name apiproxy | head -n 1)

          if [ -z "$PROXY_DIR" ]; then
            echo "apiproxy folder not found in ZIP"
            exit 1
          fi

          echo "Found apiproxy at: $PROXY_DIR"
          echo "proxy_dir=$PROXY_DIR" >> $GITHUB_OUTPUT

      # Repackage correctly
      - name: Package Proxy
        run: |
          cd $(dirname "${{ steps.locate.outputs.proxy_dir }}")
          zip -r proxy.zip apiproxy
          mv proxy.zip $GITHUB_WORKSPACE/

      # Import Proxy
      - name: Import Proxy
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -F file=@proxy.zip \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis?action=import&name=${{ inputs.deploy_proxy }}"

      # Get Latest Revision
      - name: Get Latest Revision
        id: revision
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          REV=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
          "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}/revisions" \
          | jq -r 'map(tonumber) | max')

          echo "revision=$REV" >> $GITHUB_OUTPUT

      # Deploy Proxy
      - name: Deploy Proxy
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{ "override": true }' \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/apis/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments"

      # Verify Deployment
      - name: Verify Proxy Exists
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "❌ Proxy not found"
            exit 1
          fi

          echo "✅ Proxy deployed successfully"
