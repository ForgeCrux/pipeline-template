name: Apigee Deploy

# Unique run name for tracking
run-name: Deploy ${{ inputs.deploy_proxy }} | ${{ inputs.run_key }}

on:
  workflow_dispatch:
    inputs:
      apigee_org:
        required: true
      apigee_env:
        required: true
      deploy_proxy:
        required: true
      zip_url:
        required: true
      run_key:
        required: true
      revision:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Print run info (for tracking)
      - name: Print Run Info
        run: |
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "RUN_KEY: ${{ inputs.run_key }}"

      # Install dependencies
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # Setup gcloud (safe)
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Write JSON key from secret
      - name: Create Service Account File
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > key.json

      # Authenticate
      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account \
            --key-file=key.json

      # Get token
      - name: Get Access Token
        id: token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # Download proxy
      - name: Download Proxy
        run: |
          curl -L -o proxy.zip "${{ inputs.zip_url }}"

      # Extract ZIP
      - name: Extract Proxy
        run: |
          unzip proxy.zip -d extracted
          echo "Extracted structure:"
          ls -R extracted

      # Locate apiproxy folder
      - name: Locate apiproxy
        id: locate
        run: |
          PROXY_DIR=$(find extracted -type d -name apiproxy | head -n 1)

          if [ -z "$PROXY_DIR" ]; then
            echo "apiproxy not found"
            exit 1
          fi

          echo "Found apiproxy at: $PROXY_DIR"
          echo "proxy_dir=$PROXY_DIR" >> $GITHUB_OUTPUT

      # Repackage correctly
      - name: Package Proxy
        run: |
          cd $(dirname "${{ steps.locate.outputs.proxy_dir }}")
          zip -r proxy.zip apiproxy
          mv proxy.zip $GITHUB_WORKSPACE/

      # Debug ZIP
      - name: Debug ZIP
        run: unzip -l proxy.zip

      # Import Proxy
      - name: Import Proxy (Only for DEV)
        if: ${{ inputs.apigee_env == 'dev' }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F file=@proxy.zip \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis?action=import&name=${{ inputs.deploy_proxy }}")
      
          echo "$RESPONSE"
      
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            exit 1
          fi

      - name: Resolve Revision
        id: revision
        run: |
          if [ -n "${{ inputs.revision }}" ]; then
            echo "Using provided revision: ${{ inputs.revision }}"
            REV=${{ inputs.revision }}
          else
            echo "No revision provided. Fetching latest..."
      
            REV=$(curl -s -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}/revisions" \
            | jq -r 'map(tonumber) | max')
      
            if [ -z "$REV" ] || [ "$REV" == "null" ]; then
              echo "No revision found"
              exit 1
            fi
      
            echo "Latest revision: $REV"
          fi
      
          echo "revision=$REV" >> $GITHUB_OUTPUT

      # Deploy proxy
      - name: Deploy Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data '{ "override": true }' \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/apis/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            exit 1
          fi

      # Verify deployment
      - name: Verify Deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "Proxy not found"
            exit 1
          fi

          echo "Deployment successful"

      # Cleanup (security best practice)
      - name: Cleanup
        if: always()
        run: rm -f key.json
