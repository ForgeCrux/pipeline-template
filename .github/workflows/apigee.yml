name: Apigee CI/CD Template

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      region:
        required: true
        type: string
      image_name:
        required: true
        type: string
    secrets: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, kubernetes, org]

    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
      REPOSITORY: apigee

    steps:
      - uses: actions/checkout@v4

      # ---- GCP Auth (OIDC)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
          service_account: github-ci@${{ inputs.project_id }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # ---- Docker Auth
      - name: Configure Docker
        run: gcloud auth configure-docker $ARTIFACT_REGISTRY --quiet

      # ---- Lint
      - name: Apigee Lint
        run: |
          npm install -g apigeelint
          apigeelint -s ./apigee -f table

      - name: JSON Lint
        run: |
          npm install -g jsonlint
          find . -name "*.json" -exec jsonlint -q {} \;

      # ---- Build & Push
      - name: Build and Push
        run: |
          docker build -t $ARTIFACT_REGISTRY/$PROJECT_ID/$REPOSITORY/${{ inputs.image_name }}:${{ github.sha }} .
          docker push $ARTIFACT_REGISTRY/$PROJECT_ID/$REPOSITORY/${{ inputs.image_name }}:${{ github.sha }}

      # ---- Deploy
      - name: Deploy to Apigee
        run: |
          gcloud apigee apis import \
            --name=my-api \
            --file=apigee.zip \
            --organization=$PROJECT_ID
