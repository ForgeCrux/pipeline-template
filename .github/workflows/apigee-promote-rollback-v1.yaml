name: Reusable Apigee Promote / Rollback

on:
  # Allows REST API / GitHub UI execution
  workflow_dispatch:

    inputs:
      operation:
        description: "Deployment operation: promote or rollback"
        required: true
        type: choice
        options:
          - promote
          - rollback

      apigee_org:
        description: "Target Apigee X organization"
        required: true
        type: string

      apigee_env:
        description: "Target Apigee X environment"
        required: true
        type: string

      deploy_proxy:
        description: "API Proxy or Shared Flow name"
        required: true
        type: string

      resourcetype:
        description: "Apigee resource type"
        required: true
        type: choice
        options:
          - apis
          - sharedflows

      nexus_version:
        description: "Exact Nexus version to promote or rollback"
        required: true
        type: string

      nexus_artifact_name:
        description: "Optional Nexus artifact filename"
        required: false
        default: ""
        type: string

      token_service_url:
        description: "Service used to obtain Apigee OAuth access token"
        required: false
        default: "https://token-service-113875395623.us-central1.run.app/token"
        type: string

      cicd_config_url:
        description: "ForgeSphere CI/CD configuration API"
        required: false
        default: "https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config"
        type: string

      cicd_profile_id:
        description: "ForgeSphere CI/CD profile ID"
        required: true
        type: string

# ==============================================================
# PERMISSIONS
# ==============================================================

permissions:
  contents: read
  actions: write
  id-token: write

env:
  LOG_BUFFER_SIZE: '50'
  LOG_FLUSH_INTERVAL: '2'
  LOG_REQUEST_TIMEOUT: '10'
  LOG_DRAIN_TIMEOUT: '5'

  PIPELINE_LOGS_URL: 'https://forgesphere.probestack.io/pipeline-logs'
  TOKEN_ISSUER_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  ORGANIZATION_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
  FLOW_CHANGE_ID: ${{ secrets.FLOW_CHANGE_ID != '' && secrets.FLOW_CHANGE_ID || github.run_id }}
  PL_PIPELINE_TYPE: ${{ secrets.FLOW_TYPE }}

jobs:
  promote-rollback:
    name: ${{ inputs.operation }} ${{ inputs.deploy_proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # SETUP
      # ============================================================

      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template

      - name: Install tools
        shell: bash
        env:
          LOG_STAGE: SETUP
          LOG_STEP: INSTALL_TOOLS
        run: |
          set -o pipefail

          (
            set -euo pipefail
            echo "Installing jq, unzip and zip..."
            sudo apt-get update
            sudo apt-get install -y jq unzip zip
            echo "Required tools installed successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # VALIDATION
      # ============================================================

      - name: Validate Inputs
        shell: bash
        env:
          LOG_STAGE: VALIDATION
          LOG_STEP: VALIDATE_INPUTS
        run: |
          set -o pipefail

          (
            set -euo pipefail

            OPERATION="${{ inputs.operation }}"
            RESOURCE_TYPE="${{ inputs.resourcetype }}"

            if [[ "$OPERATION" != "promote" && "$OPERATION" != "rollback" ]]; then
              echo "ERROR: operation must be promote or rollback"
              echo "Received: $OPERATION"
              exit 1
            fi

            if [[ "$RESOURCE_TYPE" != "apis" && "$RESOURCE_TYPE" != "sharedflows" ]]; then
              echo "ERROR: resourcetype must be apis or sharedflows"
              echo "Received: $RESOURCE_TYPE"
              exit 1
            fi

            if [[ -z "${{ inputs.nexus_version }}" ]]; then
              echo "ERROR: nexus_version must not be empty"
              exit 1
            fi

            if [[ -z "${{ inputs.deploy_proxy }}" ]]; then
              echo "ERROR: deploy_proxy must not be empty"
              exit 1
            fi

            if [[ -z "${{ inputs.apigee_org }}" ]]; then
              echo "ERROR: apigee_org must not be empty"
              exit 1
            fi

            if [[ -z "${{ inputs.apigee_env }}" ]]; then
              echo "ERROR: apigee_env must not be empty"
              exit 1
            fi

            if [[ -z "${{ inputs.cicd_config_url }}" ]]; then
              echo "ERROR: cicd_config_url must not be empty"
              exit 1
            fi

            if [[ -z "${{ inputs.cicd_profile_id }}" ]]; then
              echo "ERROR: cicd_profile_id must not be empty"
              exit 1
            fi

            echo "=========================================="
            echo "APIGEE RELEASE REQUEST"
            echo "=========================================="
            echo "Operation      : $OPERATION"
            echo "Organization   : ${{ inputs.apigee_org }}"
            echo "Environment    : ${{ inputs.apigee_env }}"
            echo "Resource       : $RESOURCE_TYPE"
            echo "Name           : ${{ inputs.deploy_proxy }}"
            echo "Nexus Version  : ${{ inputs.nexus_version }}"
            echo "ForgeSphere ID : ${{ inputs.cicd_profile_id }}"
            echo "=========================================="
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # FORGESPHERE CONFIGURATION
      # ============================================================

      - name: Get ForgeSphere Service Token
        id: service-token
        shell: bash
        env:
          PROB_SERVICE_TOKEN_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
          PROB_SERVICE_TOKEN_CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
          PROB_SERVICE_TOKEN_CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
          PROB_SERVICE_TOKEN_TENANT_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
          LOG_STAGE: FORGESPHERE_CONFIGURATION
          LOG_STEP: GET_SERVICE_TOKEN
        run: |
          set -o pipefail

          (
            set -euo pipefail

            echo "Requesting ForgeSphere service token..."
            python3 pipeline-template/scripts/get_service_token.py

            if [ -z "${GITHUB_OUTPUT:-}" ]; then
              echo "ERROR: GITHUB_OUTPUT is not available"
              exit 1
            fi

            echo "ForgeSphere service token generated successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Load ForgeSphere CI/CD Configuration
        id: config
        shell: bash
        env:
          CICD_CONFIG_URL: ${{ inputs.cicd_config_url }}
          CICD_CONFIG_ID: ${{ inputs.cicd_profile_id }}
          SERVICE_ACCESS_TOKEN: ${{ steps.service-token.outputs.access_token }}
          DEPLOY_PROXY: ${{ inputs.deploy_proxy }}
          RESOURCE_TYPE: ${{ inputs.resourcetype }}
          ENVIRONMENT: ${{ inputs.apigee_env }}
          LOG_STAGE: FORGESPHERE_CONFIGURATION
          LOG_STEP: LOAD_CICD_CONFIG
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [ -z "${SERVICE_ACCESS_TOKEN:-}" ]; then
              echo "ERROR: ForgeSphere service token is empty"
              exit 1
            fi

            python3 pipeline-template/scripts/load_cicd_configs.py
            echo "ForgeSphere CI/CD configuration processed successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Display ForgeSphere Configuration
        shell: bash
        env:
          LOG_STAGE: FORGESPHERE_CONFIGURATION
          LOG_STEP: DISPLAY_CONFIG
        run: |
          set -o pipefail

          (
            set -euo pipefail

            echo "=========================================="
            echo "FORGESPHERE CONFIGURATION"
            echo "=========================================="
            echo "Merge Branch    : ${{ steps.config.outputs.merge_branch }}"
            echo "Merge Tag       : ${{ steps.config.outputs.merge_tag }}"
            echo "Sonar URL       : ${{ steps.config.outputs.sonar_host_url }}"
            echo "Sonar Project   : ${{ steps.config.outputs.sonar_project_key }}"
            echo "Nexus URL       : ${{ steps.config.outputs.nexus_url }}"
            echo "Nexus Repository: ${{ steps.config.outputs.nexus_repository }}"
            echo "=========================================="
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # NEXUS DOWNLOAD
      # ============================================================

      - name: Download Package from Nexus
        id: nexus
        shell: bash
        env:
          NEXUS_URL: ${{ steps.config.outputs.nexus_url }}
          NEXUS_USERNAME: ${{ steps.config.outputs.nexus_username }}
          NEXUS_PASSWORD: ${{ steps.config.outputs.nexus_password }}
          NEXUS_REPOSITORY: ${{ steps.config.outputs.nexus_repository }}
          NEXUS_VERSION: ${{ inputs.nexus_version }}
          LOG_STAGE: NEXUS
          LOG_STEP: DOWNLOAD_PACKAGE
        run: |
          set -o pipefail

          (
            set -euo pipefail

            if [[ -z "${NEXUS_URL:-}" ]]; then
              echo "ERROR: Nexus URL is not configured"
              exit 1
            fi

            if [[ -z "${NEXUS_REPOSITORY:-}" ]]; then
              echo "ERROR: Nexus repository is not configured"
              exit 1
            fi

            ARTIFACT_NAME="${{ inputs.nexus_artifact_name }}"

            if [[ -z "$ARTIFACT_NAME" ]]; then
              ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"
            fi

            ARTIFACT_FILE="deployment-package.zip"

            DOWNLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${{ inputs.deploy_proxy }}/${NEXUS_VERSION}/${ARTIFACT_NAME}"

            echo "=========================================="
            echo "NEXUS DOWNLOAD"
            echo "=========================================="
            echo "Repository : ${NEXUS_REPOSITORY}"
            echo "Proxy      : ${{ inputs.deploy_proxy }}"
            echo "Version    : ${NEXUS_VERSION}"
            echo "Artifact   : ${ARTIFACT_NAME}"
            echo "=========================================="

            HTTP_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --user "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
                --output "$ARTIFACT_FILE" \
                --write-out "%{http_code}" \
                "$DOWNLOAD_URL"
            )"

            echo "Nexus HTTP Status: ${HTTP_STATUS}"

            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
              echo "ERROR: Failed to download artifact from Nexus"
              rm -f "$ARTIFACT_FILE"
              exit 1
            fi

            if [[ ! -s "$ARTIFACT_FILE" ]]; then
              echo "ERROR: Nexus artifact is empty"
              exit 1
            fi

            echo "Downloaded package:"
            ls -lh "$ARTIFACT_FILE"

            echo "artifact_file=$ARTIFACT_FILE" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      - name: Validate ZIP Package
        shell: bash
        env:
          LOG_STAGE: NEXUS
          LOG_STEP: VALIDATE_PACKAGE
        run: |
          set -o pipefail

          (
            set -euo pipefail

            unzip -t "${{ steps.nexus.outputs.artifact_file }}"

            echo ""
            echo "========== PACKAGE CONTENT =========="

            unzip -l "${{ steps.nexus.outputs.artifact_file }}"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # APIGEE AUTHENTICATION
      #
      # This token is different from the ForgeSphere service token.
      # ForgeSphere token -> configuration API
      # Apigee token      -> Google Apigee API
      # ============================================================

      - name: Get Apigee Access Token
        id: token
        shell: bash
        env:
          TOKEN_SERVICE_URL: ${{ inputs.token_service_url }}
          LOG_STAGE: APIGEE_AUTH
          LOG_STEP: GET_ACCESS_TOKEN
        run: |
          set -o pipefail

          (
            set -euo pipefail

            RESPONSE_FILE="$(mktemp)"

            trap 'rm -f "$RESPONSE_FILE"' EXIT

            HTTP_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                "$TOKEN_SERVICE_URL"
            )"

            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
              echo "ERROR: Failed to obtain Apigee access token"
              cat "$RESPONSE_FILE"
              exit 1
            fi

            ACCESS_TOKEN="$(
              jq -r '.access_token // empty' \
                "$RESPONSE_FILE"
            )"

            if [[ -z "$ACCESS_TOKEN" ]]; then
              echo "ERROR: access_token missing from token service response"
              exit 1
            fi

            echo "::add-mask::$ACCESS_TOKEN"

            echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

            echo "Apigee access token obtained successfully"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # IMPORT PACKAGE INTO APIGEE
      # ============================================================

      - name: Import Nexus Package into Apigee
        id: import
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          ARTIFACT_FILE: ${{ steps.nexus.outputs.artifact_file }}
          LOG_STAGE: IMPORT
          LOG_STEP: IMPORT_PACKAGE
        run: |
          set -o pipefail

          (
            set -euo pipefail

            RESOURCE_TYPE="${{ inputs.resourcetype }}"

            IMPORT_URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${RESOURCE_TYPE}?action=import&name=${{ inputs.deploy_proxy }}"

            RESPONSE_FILE="$(mktemp)"

            trap 'rm -f "$RESPONSE_FILE"' EXIT

            echo "=========================================="
            echo "APIGEE IMPORT"
            echo "=========================================="
            echo "Operation    : ${{ inputs.operation }}"
            echo "Organization : ${{ inputs.apigee_org }}"
            echo "Resource     : $RESOURCE_TYPE"
            echo "Name         : ${{ inputs.deploy_proxy }}"
            echo "Version      : ${{ inputs.nexus_version }}"
            echo "=========================================="

            HTTP_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --request POST \
                --header "Authorization: Bearer $ACCESS_TOKEN" \
                --form "file=@${ARTIFACT_FILE}" \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                "$IMPORT_URL"
            )"

            echo "Apigee Import HTTP Status: $HTTP_STATUS"

            echo ""
            echo "========== APIGEE IMPORT RESPONSE =========="
            cat "$RESPONSE_FILE"
            echo ""
            echo "============================================"

            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
              echo "ERROR: Apigee import failed"
              exit 1
            fi

            REVISION="$(
              jq -r '.revision // empty' \
                "$RESPONSE_FILE"
            )"

            if [[ -z "$REVISION" ]]; then
              echo "ERROR: Revision was not returned by Apigee"
              exit 1
            fi

            echo "New Apigee revision: $REVISION"

            echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # DEPLOY IMPORTED REVISION
      # ============================================================

      - name: Deploy Imported Revision
        id: deploy
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          REVISION: ${{ steps.import.outputs.revision }}
          LOG_STAGE: DEPLOYMENT
          LOG_STEP: DEPLOY_REVISION
        run: |
          set -o pipefail

          (
            set -euo pipefail

            RESOURCE_TYPE="${{ inputs.resourcetype }}"

            DEPLOY_URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${RESOURCE_TYPE}/${{ inputs.deploy_proxy }}/revisions/${REVISION}/deployments?override=true"

            RESPONSE_FILE="$(mktemp)"

            trap 'rm -f "$RESPONSE_FILE"' EXIT

            echo "=========================================="
            echo "APIGEE DEPLOYMENT"
            echo "=========================================="
            echo "Operation    : ${{ inputs.operation }}"
            echo "Environment  : ${{ inputs.apigee_env }}"
            echo "Proxy        : ${{ inputs.deploy_proxy }}"
            echo "Nexus Version: ${{ inputs.nexus_version }}"
            echo "Revision     : $REVISION"
            echo "=========================================="

            HTTP_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --request POST \
                --header "Authorization: Bearer $ACCESS_TOKEN" \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                "$DEPLOY_URL"
            )"

            echo "Deployment HTTP Status: $HTTP_STATUS"

            echo ""
            echo "========== DEPLOYMENT RESPONSE =========="
            cat "$RESPONSE_FILE"
            echo ""
            echo "========================================="

            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
              echo "ERROR: Apigee deployment failed"
              exit 1
            fi

            echo "Deployment request successful"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # VERIFY DEPLOYMENT
      # ============================================================

      - name: Verify Deployment
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          REVISION: ${{ steps.import.outputs.revision }}
          LOG_STAGE: VERIFY
          LOG_STEP: VERIFY_DEPLOYMENT
        run: |
          set -o pipefail

          (
            set -euo pipefail

            RESOURCE_TYPE="${{ inputs.resourcetype }}"

            VERIFY_URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${RESOURCE_TYPE}/${{ inputs.deploy_proxy }}/revisions/${REVISION}/deployments"

            echo "Waiting for Apigee deployment to become ready..."

            for ATTEMPT in $(seq 1 20); do

              RESPONSE="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --header "Authorization: Bearer $ACCESS_TOKEN" \
                  "$VERIFY_URL"
              )"

              echo ""
              echo "Attempt: $ATTEMPT"

              STATE="$(
                echo "$RESPONSE" |
                jq -r '.state // empty'
              )"

              echo "Deployment state: ${STATE:-UNKNOWN}"

              if [[ "$STATE" == "READY" ]]; then
                echo ""
                echo "Deployment is READY"
                exit 0
              fi

              if [[ "$STATE" == "ERROR" ]]; then
                echo "ERROR: Deployment entered ERROR state"
                echo "$RESPONSE"
                exit 1
              fi

              sleep 10
            done

            echo ""
            echo "ERROR: Deployment did not reach READY state"
            exit 1
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        env:
          LOG_STAGE: CLEANUP
          LOG_STEP: CLEANUP
        run: |
          set -o pipefail

          (
            set -euo pipefail

            rm -f \
              deployment-package.zip \
              cicd-config.json

            echo "Temporary files removed"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # RELEASE SUMMARY
      # ============================================================

      - name: Deployment Summary
        if: success()
        shell: bash
        env:
          LOG_STAGE: EXECUTION
          LOG_STEP: DEPLOYMENT_SUMMARY
        run: |
          set -o pipefail

          (
            set -euo pipefail

            {
              echo "## Apigee ${{ inputs.operation }} Successful"
              echo ""
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| Operation | ${{ inputs.operation }} |"
              echo "| Apigee Org | ${{ inputs.apigee_org }} |"
              echo "| Environment | ${{ inputs.apigee_env }} |"
              echo "| Resource Type | ${{ inputs.resourcetype }} |"
              echo "| Proxy / Shared Flow | ${{ inputs.deploy_proxy }} |"
              echo "| Nexus Version | ${{ inputs.nexus_version }} |"
              echo "| Apigee Revision | ${{ steps.import.outputs.revision }} |"
              echo "| ForgeSphere Config | ${{ inputs.cicd_profile_id }} |"
            } >> "$GITHUB_STEP_SUMMARY"
          ) 2>&1 | python3 pipeline-template/scripts/pipeline_logs.py stdin "$LOG_STAGE" -- "$LOG_STEP"

          RESULT=${PIPESTATUS[0]}
          if [ "$RESULT" -eq 0 ]; then
            STEP_STATUS=COMPLETED
          else
            STEP_STATUS=FAILED
          fi

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$STEP_STATUS" \
            --message "$LOG_STEP finished with exit code $RESULT" || true

          exit "$RESULT"

      # ============================================================
      # FINAL EXECUTION STATUS
      # ============================================================

      - name: Update execution status
        if: always()
        shell: bash
        env:
          LOG_STAGE: EXECUTION
          LOG_STEP: FINAL_STATUS
        run: |
          FINAL_STATUS="${{ job.status }}"

          python3 pipeline-template/scripts/pipeline_logs.py event "$LOG_STAGE" -- "$LOG_STEP" \
            --status "$FINAL_STATUS" \
            --message "GitHub Actions execution completed with status: $FINAL_STATUS" || true

          exit 0