name: Reusable Apigee Promote / Rollback

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Deployment operation: promote or rollback"
        required: true
        type: choice
        options: [promote, rollback]

      apigee_org:
        description: "Target Apigee X organization"
        required: true
        type: string

      apigee_env:
        description: "Target Apigee X environment"
        required: true
        type: string

      deploy_proxy:
        description: "API Proxy or Shared Flow name"
        required: true
        type: string

      resourcetype:
        description: "Apigee resource type"
        required: true
        type: choice
        options: [apis, sharedflows]

      nexus_version:
        description: "Exact Nexus version to promote or rollback"
        required: true
        type: string

      nexus_artifact_name:
        description: "Optional Nexus artifact filename"
        required: false
        default: ""
        type: string

      token_service_url:
        description: "Service used to obtain Apigee OAuth access token"
        required: false
        default: "https://token-service-113875395623.us-central1.run.app/token"
        type: string

      cicd_config_url:
        description: "ForgeSphere CI/CD configuration API"
        required: false
        default: "https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config"
        type: string

      cicd_profile_id:
        description: "ForgeSphere CI/CD profile ID"
        required: true
        type: string

      flow_change_id:
        description: "Optional flow change UUID to associate this run with"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

env:
  # -------- Pipeline Logs service --------
  PIPELINE_LOGS_URL: 'https://forgesphere.probestack.io/pipeline-logs'
  TOKEN_ISSUER_URL:  ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  CLIENT_ID:         ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  CLIENT_SECRET:     ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  ORGANIZATION_ID:   ${{ secrets.TENANT_ID }}
  PL_PIPELINE_TYPE:  'APIGEE'

  # -------- Flow metadata --------
  FLOW_TYPE:   ${{ inputs.resourcetype }}
  RESOURCE_ID: ${{ inputs.deploy_proxy }}

  # -------- Inputs consumed by stage scripts --------
  OPERATION:            ${{ inputs.operation }}
  APIGEE_ORG:           ${{ inputs.apigee_org }}
  APIGEE_ENV:           ${{ inputs.apigee_env }}
  DEPLOY_PROXY:         ${{ inputs.deploy_proxy }}
  RESOURCE_TYPE:        ${{ inputs.resourcetype }}
  NEXUS_VERSION:        ${{ inputs.nexus_version }}
  NEXUS_ARTIFACT_NAME:  ${{ inputs.nexus_artifact_name }}
  TOKEN_SERVICE_URL:    ${{ inputs.token_service_url }}
  CICD_CONFIG_URL:      ${{ inputs.cicd_config_url }}
  CICD_CONFIG_ID:       ${{ inputs.cicd_profile_id }}
  RAW_FLOW_CHANGE_ID:   ${{ inputs.flow_change_id }}

  # -------- Paths (match existing apigee-v2.yaml layout) --------
  ROOT_TEMPLATE_SCRIPTS:   pipeline-template/scripts
  APIGEE_TEMPLATE_SCRIPTS: pipeline-template/scripts/apigee
  PROMOTE_TEMPLATE_SCRIPTS: pipeline-template/scripts/apigee/stages/promote

jobs:
  promote-rollback:
    name: ${{ inputs.operation }} ${{ inputs.deploy_proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template

      - name: Resolve Flow Change ID
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/resolve_flow_change_id.sh"

      # -------- SETUP (existing) --------
      - name: Setup stage
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/setup.sh"

      # -------- VALIDATION (promote-specific) --------
      - name: Validation stage
        id: validate
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/validation.sh"

      # -------- FORGESPHERE CONFIG (existing) --------
      - name: ForgeSphere configuration stage
        id: config
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/forgesphere_config.sh"

      # -------- NEXUS DOWNLOAD (promote-specific) --------
      - name: Nexus download stage
        id: nexus
        env:
          NEXUS_URL:        ${{ steps.config.outputs.nexus_url }}
          NEXUS_USERNAME:   ${{ steps.config.outputs.nexus_username }}
          NEXUS_PASSWORD:   ${{ steps.config.outputs.nexus_password }}
          NEXUS_REPOSITORY: ${{ steps.config.outputs.nexus_repository }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/nexus_download.sh"

      # -------- APIGEE TOKEN (promote-specific) --------
      - name: Apigee token stage
        id: token
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/apigee_token.sh"

      # -------- IMPORT (promote-specific) --------
      - name: Import stage
        id: import
        env:
          ACCESS_TOKEN:  ${{ steps.token.outputs.access_token }}
          ARTIFACT_FILE: ${{ steps.nexus.outputs.artifact_file }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/import.sh"

      # -------- DEPLOY (promote-specific) --------
      - name: Deploy stage
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          REVISION:     ${{ steps.import.outputs.revision }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/deploy.sh"

      # -------- VERIFY (promote-specific) --------
      - name: Verify stage
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          REVISION:     ${{ steps.import.outputs.revision }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/verify.sh"

      # -------- SUMMARY (promote-specific) --------
      - name: Summary
        if: success()
        env:
          REVISION: ${{ steps.import.outputs.revision }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/summary.sh"

      # -------- CLEANUP (existing) --------
      - name: Cleanup
        if: always()
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/cleanup.sh"

      # -------- FINAL STATUS (existing) --------
      - name: Final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/final_status.sh"