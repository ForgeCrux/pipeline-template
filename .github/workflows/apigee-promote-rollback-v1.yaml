name: Reusable Apigee Promote / Rollback

on:
  workflow_dispatch:
    inputs:
      operation:       { required: true,  type: choice, options: [promote, rollback], description: "Deployment operation: promote or rollback" }
      deploy_proxy:    { required: true,  type: string, description: "API Proxy or Shared Flow name" }
      nexus_version:   { required: true,  type: string, description: "Exact Nexus version to promote or rollback" }
      cicd_profile_id: { required: true,  type: string, description: "ForgeSphere CI/CD profile ID" }
      flow_change_id:  { required: false, default: "", type: string, description: "Optional flow change UUID to associate this run with" }

permissions:
  contents: read
  actions: write

env:
  # -------- Pipeline Logs service --------
  PIPELINE_LOGS_URL: 'https://forgesphere.probestack.io/pipeline-logs'
  TOKEN_ISSUER_URL:  ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  CLIENT_ID:         ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  CLIENT_SECRET:     ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  ORGANIZATION_ID:   ${{ secrets.TENANT_ID }}
  PL_PIPELINE_TYPE:  'APIGEE'

  # -------- Inputs (only what the operator chooses) --------
  OPERATION:           ${{ inputs.operation }}
  DEPLOY_PROXY:        ${{ inputs.deploy_proxy }}
  NEXUS_VERSION:       ${{ inputs.nexus_version }}
  CICD_CONFIG_ID:      ${{ inputs.cicd_profile_id }}
  RAW_FLOW_CHANGE_ID:  ${{ inputs.flow_change_id }}

  # -------- Paths --------
  ROOT_TEMPLATE_SCRIPTS:    pipeline-template/scripts
  APIGEE_TEMPLATE_SCRIPTS:  pipeline-template/scripts/apigee
  PROMOTE_TEMPLATE_SCRIPTS: pipeline-template/scripts/apigee/stages/promote

jobs:
  promote-rollback:
    name: ${{ inputs.operation }} ${{ inputs.deploy_proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template

      - name: Resolve Flow Change ID
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/resolve_flow_change_id.sh"

      # -------- SETUP (existing) --------
      - name: Setup stage
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/setup.sh"

      # -------- FORGESPHERE SERVICE TOKEN (existing pattern) --------
      - name: Get ForgeSphere service token
        id: service-token
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/service_token.sh"

      # -------- LOAD FORGESPHERE CICD CONFIG --------
      - name: Load ForgeSphere CICD configuration
        id: config
        env:
          SERVICE_ACCESS_TOKEN: ${{ steps.service-token.outputs.access_token }}
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/forgesphere_config.sh"

      # -------- RESOLVE RUNTIME CONFIG --------
      - name: Resolve runtime configuration
        id: runtime
        env:
          APIGEE_ORG:           ${{ steps.config.outputs.apigee_org }}
          APIGEE_ENV:           ${{ steps.config.outputs.apigee_env }}
          RESOURCE_TYPE:        ${{ steps.config.outputs.resourcetype }}
          TOKEN_SERVICE_URL:    ${{ steps.config.outputs.token_service_url }}
          CICD_CONFIG_URL:      ${{ steps.config.outputs.cicd_config_url }}
          NEXUS_URL:            ${{ steps.config.outputs.nexus_url }}
          NEXUS_USERNAME:       ${{ steps.config.outputs.nexus_username }}
          NEXUS_PASSWORD:       ${{ steps.config.outputs.nexus_password }}
          NEXUS_REPOSITORY:     ${{ steps.config.outputs.nexus_repository }}
          NEXUS_ARTIFACT_NAME:  ${{ steps.config.outputs.nexus_artifact_name }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/resolve_runtime_config.sh"

      # -------- VALIDATION (promote-specific) --------
      - name: Validation stage
        id: validate
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/validation.sh"

      # -------- NEXUS DOWNLOAD (promote-specific) --------
      - name: Nexus download stage
        id: nexus
        env:
          NEXUS_URL:        ${{ steps.runtime.outputs.nexus_url }}
          NEXUS_USERNAME:   ${{ steps.runtime.outputs.nexus_username }}
          NEXUS_PASSWORD:   ${{ steps.runtime.outputs.nexus_password }}
          NEXUS_REPOSITORY: ${{ steps.runtime.outputs.nexus_repository }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/nexus_download.sh"

      # -------- APIGEE TOKEN (promote-specific) --------
      - name: Apigee token stage
        id: token
        env:
          TOKEN_SERVICE_URL: ${{ steps.runtime.outputs.token_service_url }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/apigee_token.sh"

      # -------- IMPORT (promote-specific) --------
      - name: Import stage
        id: import
        env:
          APIGEE_ORG:    ${{ steps.runtime.outputs.apigee_org }}
          RESOURCE_TYPE: ${{ steps.runtime.outputs.resourcetype }}
          ACCESS_TOKEN:  ${{ steps.token.outputs.access_token }}
          ARTIFACT_FILE: ${{ steps.nexus.outputs.artifact_file }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/import.sh"

      # -------- DEPLOY (promote-specific) --------
      - name: Deploy stage
        env:
          APIGEE_ORG:    ${{ steps.runtime.outputs.apigee_org }}
          APIGEE_ENV:    ${{ steps.runtime.outputs.apigee_env }}
          RESOURCE_TYPE: ${{ steps.runtime.outputs.resourcetype }}
          ACCESS_TOKEN:  ${{ steps.token.outputs.access_token }}
          REVISION:      ${{ steps.import.outputs.revision }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/deploy.sh"

      # -------- VERIFY (promote-specific) --------
      - name: Verify stage
        env:
          APIGEE_ORG:    ${{ steps.runtime.outputs.apigee_org }}
          APIGEE_ENV:    ${{ steps.runtime.outputs.apigee_env }}
          RESOURCE_TYPE: ${{ steps.runtime.outputs.resourcetype }}
          ACCESS_TOKEN:  ${{ steps.token.outputs.access_token }}
          REVISION:      ${{ steps.import.outputs.revision }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/verify.sh"

      # -------- SUMMARY (promote-specific) --------
      - name: Summary
        if: success()
        env:
          APIGEE_ORG:    ${{ steps.runtime.outputs.apigee_org }}
          APIGEE_ENV:    ${{ steps.runtime.outputs.apigee_env }}
          RESOURCE_TYPE: ${{ steps.runtime.outputs.resourcetype }}
          REVISION:      ${{ steps.import.outputs.revision }}
        run: bash "${PROMOTE_TEMPLATE_SCRIPTS}/summary.sh"

      # -------- CLEANUP (existing) --------
      - name: Cleanup
        if: always()
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/cleanup.sh"

      # -------- FINAL STATUS (existing) --------
      - name: Final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash "${APIGEE_TEMPLATE_SCRIPTS}/stages/final_status.sh"