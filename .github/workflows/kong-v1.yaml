name: Reusable Kong CI/CD

on:
  workflow_call:
    inputs:
      environment:        { required: false, default: dev,   type: string }
      kong_config_path:   { required: true,  type: string }
      control_plane_name: { required: true,  type: string }
      cicd_config_url:    { required: false, default: "https://forgesphere.probestack.io/cicd-automation", type: string }
      deploy_proxy:       { required: false, default: "kong", type: string }
      deck_version:       { required: false, default: "1.62.1", type: string }
      validate_only:      { required: false, default: false, type: boolean }
      deck_mode:          { required: false, default: apply, type: string }
      konnect_addr:       { required: false, default: "https://us.api.konghq.com", type: string }
      select_tag:         { required: false, default: "migrated-by:forgeshift-wso2-migrator", type: string }
      result_callback_url: { required: false, default: "", type: string }
      branch_name:        { required: false, type: string }
      version:            { required: false, default: "", type: string }

    secrets:
      cicd_profile_id:                  { required: true }
      GH_TOKEN:                         { required: true }
      APP_ID:                           { required: true }
      APP_PRIVATE_KEY:                  { required: true }
      PROB_SERVICE_TOKEN_URL:           { required: true }
      PROB_SERVICE_TOKEN_CLIENT_ID:     { required: true }
      PROB_SERVICE_TOKEN_CLIENT_SECRET: { required: true }
      PROB_SERVICE_TOKEN_TENANT_ID:     { required: true }
      FLOW_CHANGE_ID:                   { required: false }
      RESOURCE_ID:                      { required: false }
      FLOW_TYPE:                        { required: false }
      TOKEN_ISSUER_URL:                 { required: false }
      NEXUS_URL:                        { required: false }
      NEXUS_USERNAME:                   { required: false }
      NEXUS_PASSWORD:                   { required: false }
      NEXUS_REPOSITORY:                 { required: false }

permissions:
  contents: read

env:
  # -------- Pipeline Logs service --------
  PIPELINE_LOGS_URL: 'https://forgesphere.probestack.io/pipeline-logs'
  TOKEN_ISSUER_URL:  ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  CLIENT_ID:         ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  CLIENT_SECRET:     ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  ORGANIZATION_ID:   ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
  PL_PIPELINE_TYPE:  'KONG'

  # -------- Flow / trigger metadata --------
  FLOW_TYPE:   ${{ secrets.FLOW_TYPE != '' && secrets.FLOW_TYPE || 'kong' }}
  RESOURCE_ID: ${{ secrets.RESOURCE_ID != '' && secrets.RESOURCE_ID || inputs.deploy_proxy }}

  # -------- Inputs --------
  ENVIRONMENT:         ${{ inputs.environment }}
  KONG_CONFIG_PATH:    ${{ inputs.kong_config_path }}
  CONTROL_PLANE_NAME:  ${{ inputs.control_plane_name }}
  DEPLOY_PROXY:        ${{ inputs.deploy_proxy }}
  DECK_VERSION:        ${{ inputs.deck_version }}
  DECK_MODE:           ${{ inputs.deck_mode }}
  KONNECT_ADDR:        ${{ inputs.konnect_addr }}
  SELECT_TAG:          ${{ inputs.select_tag }}
  INPUT_VERSION:       ${{ inputs.version }}
  RESULT_CALLBACK_URL: ${{ inputs.result_callback_url }}
  VALIDATE_ONLY:       ${{ inputs.validate_only }}

  # -------- ForgeSphere CICD config --------
  CICD_CONFIG_URL: ${{ inputs.cicd_config_url }}
  CICD_CONFIG_ID:  ${{ secrets.cicd_profile_id }}

  # -------- Paths --------
  ROOT_TEMPLATE_SCRIPTS: pipeline-template/scripts
  KONG_TEMPLATE_SCRIPTS: pipeline-template/scripts/kong

jobs:
  kong-deploy:
    name: Kong Konnect Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template

      # -------- SETUP --------
      - name: Setup stage
        id: setup
        env:
          RAW_FLOW_CHANGE_ID: ${{ secrets.FLOW_CHANGE_ID }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/setup.sh"

      # -------- FORGESPHERE CONFIGURATION --------
      - name: ForgeSphere configuration stage
        id: config
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/forgesphere_config.sh"

      # -------- VALIDATION --------
      - name: Validation stage
        id: validate
        env:
          CONFIG_KONNECT_ADDR:  ${{ steps.config.outputs.kong_host_url }}
          CONFIG_CONTROL_PLANE: ${{ steps.config.outputs.kong_control_plane }}
          CONFIG_DECK_MODE:     ${{ steps.config.outputs.kong_deck_mode }}
          CONFIG_KONNECT_PAT:   ${{ steps.config.outputs.kong_pat_token }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/validation.sh"

      # -------- DIFF --------
      - name: Diff stage
        id: diff
        env:
          CONFIG_KONNECT_ADDR:  ${{ steps.config.outputs.kong_host_url }}
          CONFIG_CONTROL_PLANE: ${{ steps.config.outputs.kong_control_plane }}
          CONFIG_DECK_MODE:     ${{ steps.config.outputs.kong_deck_mode }}
          CONFIG_KONNECT_PAT:   ${{ steps.config.outputs.kong_pat_token }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/diff.sh"

      # -------- DEPLOYMENT --------
      - name: Deployment stage
        id: deploy
        if: ${{ inputs.validate_only == false }}
        continue-on-error: true
        env:
          CONFIG_KONNECT_ADDR:  ${{ steps.config.outputs.kong_host_url }}
          CONFIG_CONTROL_PLANE: ${{ steps.config.outputs.kong_control_plane }}
          CONFIG_DECK_MODE:     ${{ steps.config.outputs.kong_deck_mode }}
          CONFIG_KONNECT_PAT:   ${{ steps.config.outputs.kong_pat_token }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/deployment.sh"

      # -------- VERIFY --------
      - name: Verify stage
        id: verify
        if: ${{ inputs.validate_only == false }}
        continue-on-error: true
        env:
          CONFIG_KONNECT_ADDR:  ${{ steps.config.outputs.kong_host_url }}
          CONFIG_CONTROL_PLANE: ${{ steps.config.outputs.kong_control_plane }}
          CONFIG_KONNECT_PAT:   ${{ steps.config.outputs.kong_pat_token }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/verify.sh"

      # -------- VERSION --------
      - name: Version stage
        id: version
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/version.sh"

      # -------- PACKAGE --------
      - name: Package stage
        id: package
        env:
          ARTIFACT_VERSION:   ${{ steps.version.outputs.version }}
          CONTROL_PLANE_NAME: ${{ steps.config.outputs.kong_control_plane }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/package.sh"

      # -------- NEXUS --------
      - name: Nexus stage
        id: nexus
        if: ${{ inputs.validate_only == false }}
        env:
          NEXUS_URL:          ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME:     ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD:     ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY:   ${{ secrets.NEXUS_REPOSITORY }}
          ARTIFACT_VERSION:   ${{ steps.version.outputs.version }}
          CONTROL_PLANE_NAME: ${{ steps.config.outputs.kong_control_plane }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/nexus.sh"

      # -------- CLEANUP --------
      - name: Cleanup
        if: always()
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/cleanup.sh"

      # -------- FINAL STATUS --------
      - name: Final status
        if: always()
        env:
          JOB_STATUS:   ${{ job.status }}
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_INSTALL:  ${{ steps.setup.outcome }}
          OUT_VALIDATE: ${{ steps.validate.outcome }}
          OUT_DEPLOY:   ${{ steps.deploy.outcome }}
          OUT_DUMP:     ${{ steps.verify.outcome }}
          OUT_CONFIG:   ${{ steps.config.outcome }}
          DECK_MODE:    ${{ steps.config.outputs.kong_deck_mode }}
        run: bash "${KONG_TEMPLATE_SCRIPTS}/stages/final_status.sh"