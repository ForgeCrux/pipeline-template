name: Reusable CI/CD - Microservice Deploy to GKE

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      tech:
        description: "Technology stack: node | java"
        required: true
        type: string
        
      # Node inputs
      node_version:
        type: string
        default: "20"
      node_install:
        type: string
        default: "npm ci"
      node_build:
        type: string
        default: "npm run build"

      # Java inputs
      java_version:
        type: string
        default: "17"
      java_distribution:
        type: string
        default: "temurin"
      java_build:
        type: string
        default: "mvn -B clean package"
        
      projectId:
        description: "GCP project ID"
        required: false
        type: string
      project_id:
        description: "GCP project ID (legacy input name)"
        required: false
        type: string
      cicd_config_id:
        description: "CICD config ID used to resolve branch target environment"
        required: false
        type: string
      cicd_config_api_base_url:
        description: "Base URL for the CICD config API"
        required: false
        type: string
        default: "https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config"
      resource_type:
        description: "Pipeline config resource type"
        required: false
        type: string
        default: "MICROSERVICE"
      branch_name:
        description: "Branch name to use for target environment resolution"
        required: false
        type: string
      cluster_name:
        required: false
        type: string
      cluster_region:
        required: false
        type: string
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: "dev"
      artifact_registry:
        description: "Artifact Registry host"
        required: false
        type: string
        default: "us-central1-docker.pkg.dev"
      artifact_repo:
        description: "Artifact Registry repository"
        required: false
        type: string
        default: "probestack-nonprod-apps"

      # Deployment method: kubectl | helm
      deploy_method:
        description: "Choose deployment method"
        required: false
        type: string
        default: "kubectl"
    secrets:
      cicd_config_token:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ inputs.projectId || inputs.project_id }}
      ARTIFACT_REGISTRY: ${{ inputs.artifact_registry }}
      ARTIFACT_REPO: ${{ inputs.artifact_repo }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment config
        env:
          CICD_CONFIG_ID: ${{ inputs.cicd_config_id }}
          CICD_CONFIG_API_BASE_URL: ${{ inputs.cicd_config_api_base_url }}
          CICD_CONFIG_TOKEN: ${{ secrets.cicd_config_token }}
          RESOURCE_TYPE: ${{ inputs.resource_type }}
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
          FALLBACK_PROJECT_ID: ${{ inputs.projectId || inputs.project_id }}
          FALLBACK_CLUSTER_NAME: ${{ inputs.cluster_name }}
          FALLBACK_CLUSTER_REGION: ${{ inputs.cluster_region }}
          FALLBACK_NAMESPACE: ${{ inputs.namespace }}
          FALLBACK_ARTIFACT_REGISTRY: ${{ inputs.artifact_registry }}
          FALLBACK_ARTIFACT_REPO: ${{ inputs.artifact_repo }}
        run: |
          set -euo pipefail

          if [ -n "$CICD_CONFIG_ID" ]; then
            CONFIG_URL="${CICD_CONFIG_API_BASE_URL%/}/${CICD_CONFIG_ID}/all?filtered=true"
            if [ -n "$CICD_CONFIG_TOKEN" ]; then
              curl -fsSL -H "Authorization: Bearer $CICD_CONFIG_TOKEN" "$CONFIG_URL" -o cicd-config.json
            else
              curl -fsSL "$CONFIG_URL" -o cicd-config.json
            fi
          fi

          python3 - <<'PY'
          import fnmatch
          import json
          import os
          import re
          from pathlib import Path

          config_path = Path("cicd-config.json")
          branch_name = os.environ.get("INPUT_BRANCH_NAME") or os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME") or ""
          resource_type = os.environ.get("RESOURCE_TYPE") or "MICROSERVICE"

          target_env = ""
          provider = ""
          project_id = os.environ.get("FALLBACK_PROJECT_ID", "")
          cluster_name = os.environ.get("FALLBACK_CLUSTER_NAME", "")
          cluster_location = os.environ.get("FALLBACK_CLUSTER_REGION", "")
          namespace = os.environ.get("FALLBACK_NAMESPACE", "")
          artifact_registry = os.environ.get("FALLBACK_ARTIFACT_REGISTRY", "")
          artifact_repo = os.environ.get("FALLBACK_ARTIFACT_REPO", "")
          service_account_json = ""

          if config_path.exists():
              data = json.loads(config_path.read_text())
              matched_branch = None

              for strategy in data.get("strategies", []):
                  for branch in strategy.get("branches", []):
                      pattern = branch.get("name", "")
                      if pattern and fnmatch.fnmatchcase(branch_name, pattern):
                          matched_branch = branch
                          break
                  if matched_branch:
                      break

              if not matched_branch:
                  raise SystemExit(f"No strategy branch mapping matched '{branch_name}'")

              target_env = matched_branch.get("targetEnvironment") or ""
              if not target_env:
                  raise SystemExit(f"Branch '{branch_name}' matched '{matched_branch.get('name')}', but targetEnvironment is empty")

              pipeline_config = data.get("pipelineConfigs", {}).get(resource_type, {})
              env_configs = pipeline_config.get("environmentConfigs", {})
              env_config = env_configs.get(target_env)
              if not env_config:
                  raise SystemExit(f"targetEnvironment '{target_env}' was not found under pipelineConfigs.{resource_type}.environmentConfigs")

              provider = env_config.get("provider") or provider
              config = env_config.get("config") or {}
              project_id = config.get("projectId") or project_id
              cluster_name = config.get("clusterName") or cluster_name
              cluster_location = config.get("region") or cluster_location
              namespace = config.get("namespace") or namespace
              service_account_json = config.get("serviceAccountJson") or service_account_json

          if provider and provider.lower() != "gcp":
              raise SystemExit(f"targetEnvironment '{target_env}' uses provider '{provider}', but this workflow deploys to GKE/GCP")

          if service_account_json:
              for _ in range(2):
                  try:
                      decoded = json.loads(service_account_json)
                  except json.JSONDecodeError:
                      break
                  if isinstance(decoded, str):
                      service_account_json = decoded
                  elif isinstance(decoded, dict):
                      service_account_json = json.dumps(decoded)
                      break
                  else:
                      break

          missing = [
              name
              for name, value in {
                  "PROJECT_ID": project_id,
                  "GKE_CLUSTER": cluster_name,
                  "GKE_LOCATION": cluster_location,
                  "NAMESPACE": namespace,
              }.items()
              if not value
          ]
          if missing:
              raise SystemExit("Missing deployment config values: " + ", ".join(missing))

          location_flag = "--zone" if re.search(r"-[a-z]$", cluster_location) else "--region"
          registry = f"{artifact_registry}/{project_id}/{artifact_repo}/"

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"TARGET_ENV={target_env}\n")
              f.write(f"DEPLOYMENT_PROVIDER={provider}\n")
              f.write(f"PROJECT_ID={project_id}\n")
              f.write(f"GKE_CLUSTER={cluster_name}\n")
              f.write(f"GKE_LOCATION={cluster_location}\n")
              f.write(f"GKE_LOCATION_FLAG={location_flag}\n")
              f.write(f"NAMESPACE={namespace}\n")
              f.write(f"REGISTRY={registry}\n")
              if service_account_json:
                  print(f"::add-mask::{service_account_json}")
                  f.write("GCP_SERVICE_ACCOUNT_JSON<<EOF\n")
                  f.write(service_account_json)
                  f.write("\nEOF\n")

          print(f"Resolved branch '{branch_name}' to environment '{target_env or 'input-config'}'")
          PY

      # -------------------- Node --------------------
      - name: Setup Node.js
        if: inputs.tech == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Node install
        if: inputs.tech == 'node'
        run: ${{ inputs.node_install }}

      - name: Node build
        if: inputs.tech == 'node'
        env:
          CI: "false"
        run: ${{ inputs.node_build }} 
        
      # -------------------- JAVA --------------------
      - name: Setup Java
        if: inputs.tech == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Java build
        if: inputs.tech == 'java'
        run: ${{ inputs.java_build }}
        
      # -------------------- GCP Auth --------------------
      - name: Authenticate to Google Cloud (service account JSON)
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Authenticate to Google Cloud (OIDC)
        if: env.GCP_SERVICE_ACCOUNT_JSON == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@probestack-prod.iam.gserviceaccount.com
          
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Enable GKE gcloud auth plugin
        run: echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # -------------------- Build & Push --------------------
      - name: Build and Push Docker Image
        run: |
          set -e
          FULL_IMAGE="${REGISTRY}${{ inputs.image_name }}"
          IMAGE_TAG=${{ github.sha }}
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}
          TAG="${BRANCH_NAME}-${IMAGE_TAG::7}"

          echo "Building ${FULL_IMAGE}:${TAG}"
          docker build -t "${FULL_IMAGE}:${TAG}" .

          echo "Pushing ${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${TAG}"

          echo "IMAGE_URI=${FULL_IMAGE}:${TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "SERVICE_NAME=${{ inputs.image_name }}" >> $GITHUB_ENV

      # -------------------- GKE Setup --------------------
      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet
      
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            "$GKE_LOCATION_FLAG" "$GKE_LOCATION" \
            --project "$PROJECT_ID"

      # -------------------- Deploy --------------------
      - name: Deploy with kubectl
        if: inputs.deploy_method == 'kubectl'
        run: |
          : "${IMAGE_TAG:?IMAGE_TAG not set}"
          : "${SERVICE_NAME:?SERVICE_NAME not set}"
      
          envsubst '${SERVICE_NAME} ${IMAGE_TAG}' < k8s/deployment.yaml \
            | kubectl apply -f - -n "$NAMESPACE"
      
          kubectl rollout status deployment/${{ inputs.service_name }} \
            -n "$NAMESPACE"

      - name: Deploy with Helm
        if: inputs.deploy_method == 'helm'
        run: |
          helm upgrade --install ${{ inputs.service_name }} ./helm \
            --namespace "$NAMESPACE" \
            --set image.repository="${REGISTRY}${{ inputs.image_name }}" \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set nameOverride=${{ inputs.service_name }}

      # -------------------- Verify --------------------
      - name: Verify GKE Deployment
        run: |
          set -e
          for i in {1..5}; do
            kubectl get pods -n "$NAMESPACE" | grep ${{ inputs.service_name }}
            echo "Sleep 10"
            sleep 10
          done
          kubectl describe deployment ${{ inputs.service_name }} -n "$NAMESPACE" | grep -i Image
          echo "Successfully built ${{ inputs.service_name }} and deployed to $NAMESPACE namespace"
