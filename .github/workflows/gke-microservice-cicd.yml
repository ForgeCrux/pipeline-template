name: Reusable CI/CD - Microservice Deploy to GKE

# Apply permissions to all jobs in this reusable workflow (or move to job-level)
permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      cluster_region:
        required: true
        type: string
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      namespace:
        required: true
        type: string
        default: "dev"
    # Remove this if using OIDC; keep only if you choose key-based auth:
    # secrets:
    #   GCP_SA_KEY:
    #     required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # If you prefer per-job permissions, uncomment and keep this matching top level:
    # permissions:
    #   contents: read
    #   id-token: write

    env:
      # Ensure trailing slash here once, so we can concatenate image name cleanly
      registry: "us-central1-docker.pkg.dev/methodical-mark-482504-j3/probestack-nonprod-apps"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1076618220242/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@methodical-mark-482504-j3.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          FULL_IMAGE: ${{ env.registry }}${{ inputs.image_name }}
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}
          TAG="${BRANCH_NAME}-${IMAGE_TAG}"

          echo "Building ${FULL_IMAGE}:${TAG}"
          docker build -t "${FULL_IMAGE}:${TAG}" .

          echo "Pushing ${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${TAG}"

          echo "IMAGE_URI=${FULL_IMAGE}:${TAG}" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ inputs.cluster_name }} \
            --region ${{ inputs.cluster_region }} \
            --project ${{ inputs.project_id }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/${{ inputs.service_name }} \
            ${{ inputs.service_name }}=${IMAGE_URI} \
            -n ${{ inputs.namespace }}

          kubectl rollout status deployment/${{ inputs.service_name }} -n ${{ inputs.namespace }}

      - name: Health Check
        run: |
          set -e
          for i in {1..20}; do
            SERVICE_IP=$(kubectl get svc ${{ inputs.service_name }} \
              -n ${{ inputs.namespace }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$SERVICE_IP" ]; then
              echo "Service IP: $SERVICE_IP"
              break
            fi
            echo "Waiting for LoadBalancer IP... ($i/20)"
            sleep 10
          done

          if [ -z "$SERVICE_IP" ]; then
            echo "No LoadBalancer IP assigned within timeout"
            exit 1
          fi

          curl -f "http://$SERVICE_IP/actuator/health"
