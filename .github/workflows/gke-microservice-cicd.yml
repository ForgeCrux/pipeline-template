name: Reusable CI/CD - Microservice Deploy to GKE

# Apply permissions to all jobs in this reusable workflow (or move to job-level)
permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      tech:
        description: "Technology stack: node | java"
        required: true
        type: string
        
      # Node inputs
      node_version:
        type: string
        default: "20"
      node_install:
        type: string
        default: "npm ci"
      node_build:
        type: string
        default: "npm run build"

      # Java inputs
      java_version:
        type: string
        default: "17"
      java_distribution:
        type: string
        default: "temurin"
      java_build:
        type: string
        default: "mvn -B clean package"
        
      project_id:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      cluster_region:
        required: true
        type: string
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      namespace:
        required: true
        type: string
        default: "dev"
    # Remove this if using OIDC; keep only if you choose key-based auth:
    # secrets:
    #   GCP_SA_KEY:
    #     required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # If you prefer per-job permissions, uncomment and keep this matching top level:
    # permissions:
    #   contents: read
    #   id-token: write

    env:
      # Ensure trailing slash here once, so we can concatenate image name cleanly
      registry: "us-central1-docker.pkg.dev/methodical-mark-482504-j3/probestack-nonprod-apps/"

    steps:
      - uses: actions/checkout@v4
      # -------------------- Node --------------------
      - name: Setup Node.js
        if: inputs.tech == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Node install
        if: inputs.tech == 'node'
        run: ${{ inputs.node_install }}

      #- name: Node build
      #  if: inputs.tech == 'node'
      #  run: |
      #    ls -la
      #    npm install mobx styled-components --save
      #    npm run build 
      #    ls -la 
      #    ls -la dist/
          
      - name: Node build
        if: inputs.tech == 'node'  
        env:
          CI: "false"
        run: ${{ inputs.node_build }} 
        
      # -------------------- JAVA --------------------
      - name: Setup Java
        if: inputs.tech == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Java build
        if: inputs.tech == 'java'
        run: ${{ inputs.java_build }}
        
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1076618220242/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@methodical-mark-482504-j3.iam.gserviceaccount.com
          
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id }}
      
      - name: Enable GKE gcloud auth plugin
        run: echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV


      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          FULL_IMAGE: ${{ env.registry }}${{ inputs.image_name }}
        run: |
          set -e
          pwd && ls -la && ls -la dist/
          IMAGE_TAG=${{ github.sha }}
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}
          TAG="${BRANCH_NAME}-${IMAGE_TAG::7}"

          echo "Building ${FULL_IMAGE}:${TAG}"
          docker build -t "${FULL_IMAGE}:${TAG}" .

          echo "Pushing ${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${TAG}"

          echo "IMAGE_URI=${FULL_IMAGE}:${TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet
      
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ inputs.cluster_name }} \
            --region ${{ inputs.cluster_region }} \
            --project ${{ inputs.project_id }}

      - name: Deploy to GKE
        run: |
          : "${IMAGE_TAG:?IMAGE_TAG not set}"
      
          envsubst '${IMAGE_TAG}' < k8s/deployment.yaml \
            | kubectl apply -f - -n ${{ inputs.namespace }}
      
          kubectl rollout status deployment/${{ inputs.service_name }} \
            -n ${{ inputs.namespace }}
            
      - name: Verify GKE Deployment
        run: |
          set -e
          for i in {1..5}; do
            kubectl get pods -n ${{ inputs.namespace }} | grep ${{ inputs.service_name }}
            echo "Sleep 10"
            sleep 10
          done
          kubectl describe deployment ${{ inputs.service_name }} -n ${{ inputs.namespace }}
          echo "Sucessfully Build ${{ inputs.service_name }} and Deloyed to -n ${{ inputs.namespace }} Namespace"
