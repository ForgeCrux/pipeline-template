name: Reusable CI/CD - Microservice Deploy to GKE

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      tech:
        description: "Technology stack: node | java"
        required: true
        type: string
        
      # Node inputs
      node_version:
        type: string
        default: "20"
      node_install:
        type: string
        default: "npm ci"
      node_build:
        type: string
        default: "npm run build"

      # Java inputs
      java_version:
        type: string
        default: "17"
      java_distribution:
        type: string
        default: "temurin"
      java_build:
        type: string
        default: "mvn -B clean package"
        
      project_id:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      cluster_region:
        required: true
        type: string
      service_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      namespace:
        required: true
        type: string
        default: "dev"

      # Deployment method: kubectl | helm
      deploy_method:
        description: "Choose deployment method"
        required: false
        type: string
        default: "kubectl"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      registry: "us-central1-docker.pkg.dev/methodical-mark-482504-j3/probestack-nonprod-apps/"

    steps:
      - uses: actions/checkout@v4

      # -------------------- Node --------------------
      - name: Setup Node.js
        if: inputs.tech == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Node install
        if: inputs.tech == 'node'
        run: ${{ inputs.node_install }}

      - name: Node build
        if: inputs.tech == 'node'
        env:
          CI: "false"
        run: ${{ inputs.node_build }} 
        
      # -------------------- JAVA --------------------
      - name: Setup Java
        if: inputs.tech == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Java build
        if: inputs.tech == 'java'
        run: ${{ inputs.java_build }}
        
      # -------------------- GCP Auth --------------------
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@probestack-prod.iam.gserviceaccount.com
          
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id }}
      
      - name: Enable GKE gcloud auth plugin
        run: echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # -------------------- Build & Push --------------------
      - name: Build and Push Docker Image
        env:
          FULL_IMAGE: ${{ env.registry }}${{ inputs.image_name }}
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}
          TAG="${BRANCH_NAME}-${IMAGE_TAG::7}"

          echo "Building ${FULL_IMAGE}:${TAG}"
          docker build -t "${FULL_IMAGE}:${TAG}" .

          echo "Pushing ${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${TAG}"

          echo "IMAGE_URI=${FULL_IMAGE}:${TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "SERVICE_NAME=${{ inputs.image_name }}" >> $GITHUB_ENV

      # -------------------- GKE Setup --------------------
      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet
      
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ inputs.cluster_name }} \
            --region ${{ inputs.cluster_region }} \
            --project ${{ inputs.project_id }}

      # -------------------- Deploy --------------------
      - name: Deploy with kubectl
        if: inputs.deploy_method == 'kubectl'
        run: |
          : "${IMAGE_TAG:?IMAGE_TAG not set}"
          : "${SERVICE_NAME:?SERVICE_NAME not set}"
      
          envsubst '${SERVICE_NAME} ${IMAGE_TAG}' < k8s/deployment.yaml \
            | kubectl apply -f - -n ${{ inputs.namespace }}
      
          kubectl rollout status deployment/${{ inputs.service_name }} \
            -n ${{ inputs.namespace }}

      - name: Deploy with Helm
        if: inputs.deploy_method == 'helm'
        run: |
          helm upgrade --install ${{ inputs.service_name }} ./helm \
            --namespace ${{ inputs.namespace }} \
            --set image.repository=${{ env.registry }}${{ inputs.image_name }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set nameOverride=${{ inputs.service_name }}

      # -------------------- Verify --------------------
      - name: Verify GKE Deployment
        run: |
          set -e
          for i in {1..5}; do
            kubectl get pods -n ${{ inputs.namespace }} | grep ${{ inputs.service_name }}
            echo "Sleep 10"
            sleep 10
          done
          kubectl describe deployment ${{ inputs.service_name }} -n ${{ inputs.namespace }} | grep -i Image
          echo "Successfully built ${{ inputs.service_name }} and deployed to ${{ inputs.namespace }} namespace"
