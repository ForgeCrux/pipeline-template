name: Reusable MCP Server CI/CD (Java Spring Boot)

on:
  workflow_call:
    inputs:
      server_name:         { required: true,  type: string }
      k8s_namespace:       { required: true,  type: string }
      k8s_cluster:         { required: true,  type: string }
      deploy_strategy:     { required: true,  type: string }   # helm | kustomize

      # Java-specific
      java_version:        { required: false, default: '21', type: string }
      build_tool:          { required: false, default: 'maven', type: string }   # maven | gradle
      maven_args:          { required: false, default: '-DskipTests', type: string }
      gradle_args:         { required: false, default: '-x test', type: string }
      jar_path:            { required: false, default: 'target/*.jar', type: string }

      # MCP manifest (optional — tools often declared via annotations)
      mcp_manifest_path:   { required: false, default: './mcp.json', type: string }

      # Docker / chart
      dockerfile_path:     { required: false, default: './Dockerfile', type: string }
      helm_chart_path:     { required: false, default: './charts', type: string }
      kustomize_path:      { required: false, default: './k8s/overlays', type: string }
      helm_values_file:    { required: false, default: '', type: string }
      replica_count:       { required: false, default: '2', type: string }

      # MCP endpoints (Spring AI defaults)
      mcp_sse_path:        { required: false, default: '/sse', type: string }
      mcp_messages_path:   { required: false, default: '/mcp/message', type: string }
      health_check_path:   { required: false, default: '/actuator/health', type: string }
      health_check_timeout:{ required: false, default: '120', type: string }
      mcp_verify_timeout:  { required: false, default: '180', type: string }

      branch_name:         { required: false, type: string }
      version:             { required: false, default: '', type: string }
      cicd_config_url:     { required: false, default: 'https://forgesphere.probestack.io/cicd-automation', type: string }
      gitops_repo_org:     { required: false, default: '', type: string }
      gitops_repo_name:    { required: false, default: '', type: string }
      argocd_app_name:     { required: false, default: '', type: string }
      argocd_project:      { required: false, default: '', type: string }

    secrets:
      cicd_profile_id:                  { required: true }
      GH_TOKEN:                         { required: true }
      APP_ID:                           { required: true }
      APP_PRIVATE_KEY:                  { required: true }
      PROB_SERVICE_TOKEN_URL:           { required: true }
      PROB_SERVICE_TOKEN_CLIENT_ID:     { required: true }
      PROB_SERVICE_TOKEN_CLIENT_SECRET: { required: true }
      PROB_SERVICE_TOKEN_TENANT_ID:     { required: true }
      FLOW_CHANGE_ID:                   { required: false }
      RESOURCE_ID:                      { required: false }
      FLOW_TYPE:                        { required: false }
      TOKEN_ISSUER_URL:                 { required: false }
      ARGOCD_USERNAME:                  { required: false }
      ARGOCD_PASSWORD:                  { required: false }
      ARGOCD_TOKEN:                     { required: false }

permissions:
  contents: read

env:
  PIPELINE_LOGS_URL: 'https://forgesphere.probestack.io/pipeline-logs'
  TOKEN_ISSUER_URL:  ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  CLIENT_ID:         ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  CLIENT_SECRET:     ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  ORGANIZATION_ID:   ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
  PL_PIPELINE_TYPE:  'MCP'

  PROB_SERVICE_TOKEN_URL:           ${{ secrets.PROB_SERVICE_TOKEN_URL }}
  PROB_SERVICE_TOKEN_CLIENT_ID:     ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
  PROB_SERVICE_TOKEN_CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
  PROB_SERVICE_TOKEN_TENANT_ID:     ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}

  FLOW_TYPE:   ${{ secrets.FLOW_TYPE != '' && secrets.FLOW_TYPE || 'mcp' }}
  RESOURCE_ID: ${{ secrets.RESOURCE_ID != '' && secrets.RESOURCE_ID || inputs.server_name }}

  SERVER_NAME:           ${{ inputs.server_name }}
  K8S_NAMESPACE:         ${{ inputs.k8s_namespace }}
  K8S_CLUSTER:           ${{ inputs.k8s_cluster }}
  DEPLOY_STRATEGY:       ${{ inputs.deploy_strategy }}
  JAVA_VERSION:          ${{ inputs.java_version }}
  BUILD_TOOL:            ${{ inputs.build_tool }}
  MAVEN_ARGS:            ${{ inputs.maven_args }}
  GRADLE_ARGS:           ${{ inputs.gradle_args }}
  JAR_PATH:              ${{ inputs.jar_path }}
  MCP_MANIFEST_PATH:     ${{ inputs.mcp_manifest_path }}
  DOCKERFILE_PATH:       ${{ inputs.dockerfile_path }}
  HELM_CHART_PATH:       ${{ inputs.helm_chart_path }}
  KUSTOMIZE_PATH:        ${{ inputs.kustomize_path }}
  HELM_VALUES_FILE:      ${{ inputs.helm_values_file }}
  REPLICA_COUNT:         ${{ inputs.replica_count }}
  MCP_SSE_PATH:          ${{ inputs.mcp_sse_path }}
  MCP_MESSAGES_PATH:     ${{ inputs.mcp_messages_path }}
  HEALTH_CHECK_PATH:     ${{ inputs.health_check_path }}
  HEALTH_CHECK_TIMEOUT:  ${{ inputs.health_check_timeout }}
  MCP_VERIFY_TIMEOUT:    ${{ inputs.mcp_verify_timeout }}
  BRANCH_NAME:           ${{ inputs.branch_name }}
  INPUT_VERSION:         ${{ inputs.version }}
  GITOPS_REPO_ORG:       ${{ inputs.gitops_repo_org }}
  GITOPS_REPO_NAME:      ${{ inputs.gitops_repo_name }}
  ARGOCD_APP_NAME_OVERRIDE: ${{ inputs.argocd_app_name }}
  ARGOCD_PROJECT_OVERRIDE:  ${{ inputs.argocd_project }}
  ARGOCD_USERNAME:       ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD:       ${{ secrets.ARGOCD_PASSWORD }}
  ARGOCD_TOKEN:          ${{ secrets.ARGOCD_TOKEN }}

  CICD_CONFIG_URL: ${{ inputs.cicd_config_url }}
  CICD_CONFIG_ID:  ${{ secrets.cicd_profile_id }}

  ROOT_TEMPLATE_SCRIPTS: pipeline-template/scripts
  MCP_TEMPLATE_SCRIPTS:  pipeline-template/scripts/mcp

jobs:
  build-and-deploy:
    name: Build & Deploy MCP Server (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template
          token: ${{ secrets.GH_TOKEN }}

      - name: Resolve Flow Change ID
        env:
          RAW_FLOW_CHANGE_ID: ${{ secrets.FLOW_CHANGE_ID }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/resolve_flow_change_id.sh"

      - name: Setup stage
        id: setup
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/setup.sh"

      - name: Validation stage
        id: validate
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/validation.sh"

      - name: ForgeSphere configuration stage
        id: config
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/forgesphere_config.sh"

      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Select GitHub token
        id: token-select
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN:  ${{ secrets.GH_TOKEN }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/select_github_token.sh"

      - name: Lint stage
        env:
          GH_LINT_TOKEN: ${{ steps.token-select.outputs.token }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/lint.sh"

      - name: Sonar stage
        if: steps.config.outputs.sonar_host_url != ''
        env:
          SONAR_HOST_URL:    ${{ steps.config.outputs.sonar_host_url }}
          SONAR_TOKEN:       ${{ steps.config.outputs.sonar_token }}
          SONAR_PROJECT_KEY: ${{ steps.config.outputs.sonar_project_key }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/sonar.sh"

      - name: Version stage
        id: version
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/version.sh"

      - name: Build and push image
        id: build
        env:
          REGISTRY_URL:      ${{ steps.config.outputs.registry_url }}
          REGISTRY_USERNAME: ${{ steps.config.outputs.registry_username }}
          REGISTRY_PASSWORD: ${{ steps.config.outputs.registry_password }}
          IMAGE_TAG:         ${{ steps.version.outputs.version }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/build.sh"

      - name: GitOps stage
        id: gitops
        env:
          GH_TOKEN:           ${{ steps.token-select.outputs.token }}
          REGISTRY_URL:       ${{ steps.config.outputs.registry_url }}
          IMAGE_TAG:          ${{ steps.version.outputs.version }}
          GITOPS_REPO_URL:    ${{ steps.config.outputs.gitops_repo_url }}
          GITOPS_REPO_BRANCH: ${{ steps.config.outputs.gitops_repo_branch }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/gitops.sh"

      - name: ArgoCD application stage
        id: argocd-app
        env:
          ARGOCD_SERVER:   ${{ steps.config.outputs.argocd_server }}
          ARGOCD_PROJECT:  ${{ steps.config.outputs.argocd_project }}
          GITOPS_REPO_URL: ${{ steps.gitops.outputs.repo_url }}
          GH_TOKEN:        ${{ steps.token-select.outputs.token }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/argocd_app.sh"

      - name: ArgoCD sync stage
        id: argocd-sync
        env:
          ARGOCD_SERVER: ${{ steps.config.outputs.argocd_server }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/argocd_sync.sh"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
          service_account:            ${{ steps.config.outputs.service_account }}

      - name: Verify stage
        id: verify
        env:
          GKE_LOCATION: ${{ steps.config.outputs.gke_location }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/verify.sh"

      - name: Cleanup
        if: always()
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/cleanup.sh"

      - name: Final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash "${MCP_TEMPLATE_SCRIPTS}/stages/final_status.sh"