name: Reusable Apigee CI/CD (K8s Runner)

on:
  push:
    branches:
      - main

  workflow_call:
    inputs:
      apigee_org:
        required: true
        type: string
      apigee_env:
        required: true
        type: string
      deploy_proxy:
        required: true
        type: string
      resourcetype:
        required: true
        type: string
      node_version:
        required: false
        default: '18'
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Force GitHub auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Validate Resource Type
        run: |
          if [[ "${{ inputs.resourcetype }}" != "apis" && "${{ inputs.resourcetype }}" != "sharedflows" ]]; then
            echo "Invalid resourcetype: ${{ inputs.resourcetype }}"
            echo "Allowed values: apis | sharedflows"
            exit 1
          fi

      # -------------------------
      # OPTIONAL GITHUB APP TOKEN
      # -------------------------
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # -------------------------
      # SAFE TOKEN FALLBACK
      # -------------------------
      - name: Select Token
        id: token-select
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.GH_TOKEN }}" >> $GITHUB_OUTPUT
          fi

      # -------------------------
      # OPTIONAL CHECKOUT
      # -------------------------
      - name: Checkout lint rules
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ steps.token-select.outputs.token }}

      # -------------------------
      # OPTIONAL LINT
      # -------------------------
      - name: Apigee Lint
        continue-on-error: true
        run: |
          if [ -d "./apigee-linting-custom" ]; then
            npx apigeelint -s apiproxy -x ./apigee-linting-custom/rules -f table.js || true
          else
            echo "Skipping lint (rules repo not available)"
          fi

      - name: JS Lint
        continue-on-error: true
        run: |
          npx jslint apiproxy/**/*.js || true

      - name: Sonar Scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonarqube-scanner \
            -Dsonar.organization=forgecrux \
            -Dsonar.projectKey=${{ github.event.repository.name }} \
            -Dsonar.sources=apiproxy || true

      # -------------------------
      # PACKAGE
      # -------------------------
      - name: Package Proxy
        run: |
          test -d apiproxy
          zip -r proxy.zip apiproxy

      # -------------------------
      # GCP AUTH
      # -------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Service Account File
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > key.json

      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account --key-file=key.json

      - name: Get Access Token
        id: token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # -------------------------
      # IMPORT
      # -------------------------
      - name: Import Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F file=@proxy.zip \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}?action=import&name=${{ inputs.deploy_proxy }}")

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            exit 1
          fi

      # -------------------------
      # GET REVISION
      # -------------------------
      - name: Get Latest Revision
        id: revision
        run: |
          REV=$(curl -s -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
          "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions" \
          | jq -r 'map(tonumber) | max')

          echo "revision=$REV" >> $GITHUB_OUTPUT

      # -------------------------
      # DEPLOY
      # -------------------------
      - name: Deploy Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data '{ "override": true }' \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments")

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            exit 1
          fi

      # -------------------------
      # VERIFY
      # -------------------------
      - name: Verify Deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
              "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "Proxy does not exist"
            exit 1
          fi

          echo "Deployment successful"

      - name: Cleanup
        if: always()
        run: rm -f key.json
