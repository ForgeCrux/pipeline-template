name: Reusable Apigee CI/CD (K8s Runner)

on:
  workflow_call:
    inputs:
      # =================================================
      # APIGEE
      # =================================================
      apigee_org:
        required: true
        type: string

      apigee_env:
        required: true
        type: string

      deploy_proxy:
        required: true
        type: string

      resourcetype:
        required: true
        type: string

      node_version:
        required: false
        default: '18'
        type: string

      branch_name:
        required: false
        type: string
      # =================================================
      # FORGESPHERE
      # =================================================
      cicd_config_url:
        required: false
        default: 'https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config'
        type: string
      # =================================================
      # OPTIONAL VERSION OVERRIDE
      # =================================================
      version:
        required: false
        default: ''
        type: string

    secrets:
      cicd_profile_id:
        required: true
      # GitHub authentication
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      # ForgeSphere service authentication
      PROB_SERVICE_TOKEN_URL:
        required: true
      PROB_SERVICE_TOKEN_CLIENT_ID:
        required: true
      PROB_SERVICE_TOKEN_CLIENT_SECRET:
        required: true
      PROB_SERVICE_TOKEN_TENANT_ID:
        required: true
# =========================================================
# PERMISSIONS
# =========================================================
permissions:
  contents: read


# =========================================================
# GLOBAL ENV
# =========================================================
env:
  RESOURCE_TYPE: ${{ inputs.resourcetype }}
  BUNDLE_DIR: ${{ inputs.resourcetype == 'apis' && 'apiproxy' || 'sharedflowbundle' }}


# =========================================================
# JOB
# =========================================================
jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===================================================
      # SETUP
      # ===================================================
      - name: Start group Setup
        run: echo "::group::Setup"

      # ---------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pipeline template
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/pipeline-template
          ref: main
          path: pipeline-template
      # ---------------------------------------------------
      # NODE
      # ---------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # ---------------------------------------------------
      # TOOLS
      # ---------------------------------------------------
      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y jq unzip zip

      # ---------------------------------------------------
      # GITHUB AUTH
      # ---------------------------------------------------
      - name: Force GitHub auth
        run: |
          set -euo pipefail

          git config --global \
            url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: End group Setup
        if: always()
        run: echo "::endgroup::"
      # ===================================================
      # VALIDATION
      # ===================================================
      - name: Start group Validation
        run: echo "::group::Validation"

      # ---------------------------------------------------
      # VALIDATE RESOURCE TYPE
      # ---------------------------------------------------
      - name: Validate Resource Type
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.resourcetype }}" != "apis" &&
                "${{ inputs.resourcetype }}" != "sharedflows" ]]; then

            echo "ERROR: Invalid resourcetype: ${{ inputs.resourcetype }}"
            exit 1
          fi

          echo "Resource type: ${{ inputs.resourcetype }}"
      # ---------------------------------------------------
      # VALIDATE RELEASE PROPERTIES
      # ---------------------------------------------------
      - name: Validate release.properties
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f release.properties ]; then
            echo "ERROR: release.properties not found"
            exit 1
          fi

          if ! grep -q '^version=' release.properties; then
            echo "ERROR: version property not found"
            exit 1
          fi
          BASE_VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)
          echo "Base version: $BASE_VERSION"

      - name: End group Validation
        if: always()
        run: echo "::endgroup::"
      # ===================================================
      # FORGESPHERE CONFIGURATION
      # ===================================================
      - name: Start group ForgeSphere Configuration
        run: echo "::group::ForgeSphere Configuration"

      # ---------------------------------------------------
      # GET FORGESPHERE SERVICE TOKEN
      # ---------------------------------------------------
      - name: Get ForgeSphere Service Token
        id: service-token
        shell: bash
        env:
          PROB_SERVICE_TOKEN_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
          PROB_SERVICE_TOKEN_CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
          PROB_SERVICE_TOKEN_CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
          PROB_SERVICE_TOKEN_TENANT_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
        run: |
          set -euo pipefail
          echo "Requesting ForgeSphere service token..."
          python3 pipeline-template/scripts/get_service_token.py
          if [ -z "${GITHUB_OUTPUT:-}" ]; then
            echo "ERROR: GITHUB_OUTPUT is not available"
            exit 1
          fi
          echo "ForgeSphere service token generated successfully"

      # ---------------------------------------------------
      # LOAD FORGESPHERE CONFIGURATION
      # ---------------------------------------------------
      - name: Load ForgeSphere CI/CD Configuration
        id: config
        shell: bash
        env:
          CICD_CONFIG_URL: ${{ inputs.cicd_config_url }}
          CICD_CONFIG_ID: ${{ secrets.cicd_profile_id }}
          SERVICE_ACCESS_TOKEN: ${{ steps.service-token.outputs.access_token }}
          DEPLOY_PROXY: ${{ inputs.deploy_proxy }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: ForgeSphere service token is empty"
            exit 1
          fi
          python3 pipeline-template/scripts/load_cicd_config.py
          echo "ForgeSphere CI/CD configuration processed successfully"

      - name: End group ForgeSphere Configuration
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # OPTIONAL GITHUB APP TOKEN
      # ===================================================

      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # ---------------------------------------------------
      # SELECT GITHUB TOKEN
      # ---------------------------------------------------

      - name: Select Token
        id: token-select
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${APP_TOKEN:-}" ]; then
            echo "Using GitHub App token"
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "Using GH_TOKEN"
            echo "token=${GH_TOKEN}" >> "$GITHUB_OUTPUT"
          fi


      # ===================================================
      # LINT
      # ===================================================

      - name: Start group Lint
        run: echo "::group::Lint"

      # ---------------------------------------------------
      # CHECKOUT LINT RULES
      # ---------------------------------------------------

      - name: Checkout lint rules
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ steps.token-select.outputs.token }}

      # ---------------------------------------------------
      # APIGEE LINT
      # ---------------------------------------------------

      - name: Apigee Lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "./apigee-linting-custom" ]; then

            npx apigeelint \
              -s "$BUNDLE_DIR" \
              -x ./apigee-linting-custom/rules \
              -f table.js || true

          else
            echo "Skipping Apigee lint"
          fi

      # ---------------------------------------------------
      # JS LINT
      # ---------------------------------------------------

      - name: JS Lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          npx jslint "$BUNDLE_DIR"/**/*.js || true


      # ===================================================
      # SONAR
      # ===================================================

      - name: Sonar Scan
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ steps.config.outputs.sonar_host_url }}
          SONAR_TOKEN: ${{ steps.config.outputs.sonar_token }}
          SONAR_PROJECT_KEY: ${{ steps.config.outputs.sonar_project_key }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running SonarQube scan"

          npx sonarqube-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.sources="$BUNDLE_DIR"

      - name: End group Lint
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # VERSION
      # ===================================================

      - name: Calculate Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then

            VERSION="$INPUT_VERSION"

          else

            BASE_VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)
            SHORT_SHA=$(git rev-parse --short HEAD)

            VERSION="${BASE_VERSION}-${SHORT_SHA}"

          fi

          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ===================================================
      # PACKAGE
      # ===================================================

      - name: Start group Package
        run: echo "::group::Package"

      - name: Package Proxy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
          fi

          echo "RESOURCE_TYPE=$RESOURCE_TYPE"
          echo "BUNDLE_DIR=$BUNDLE_DIR"
          echo "ZIP_FILE=$ZIP_FILE"

          test -d "$BUNDLE_DIR"

          zip -r "$ZIP_FILE" "$BUNDLE_DIR"

          ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"

          cp "$ZIP_FILE" "$ARTIFACT_NAME"

          echo "========================================"
          echo "ZIP CREATED"
          echo "Artifact: $ARTIFACT_NAME"
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "========================================"

          ls -lh "$ZIP_FILE" "$ARTIFACT_NAME"

      - name: End group Package
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # NEXUS PUSH
      # ===================================================

      - name: Start group Nexus Push
        run: echo "::group::Nexus Push"

      - name: Push Package to Nexus
        if: |
          steps.config.outputs.nexus_url != '' &&
          steps.config.outputs.merge_branch == inputs.branch_name
        shell: bash
        env:
          NEXUS_URL: ${{ steps.config.outputs.nexus_url }}
          NEXUS_REPOSITORY: ${{ steps.config.outputs.nexus_repository }}
          NEXUS_USERNAME: ${{ steps.config.outputs.nexus_username }}
          NEXUS_PASSWORD: ${{ steps.config.outputs.nexus_password }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$ARTIFACT_NAME" ]; then
            echo "ERROR: Package not found: $ARTIFACT_NAME"
            exit 1
          fi

          if [ -z "$NEXUS_REPOSITORY" ]; then
            echo "ERROR: Nexus repository not configured"
            exit 1
          fi

          UPLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${{ inputs.deploy_proxy }}/${VERSION}/${ARTIFACT_NAME}"

          echo "========================================"
          echo "NEXUS UPLOAD"
          echo "========================================"
          echo "Host       : ${NEXUS_URL%/}"
          echo "Repository : $NEXUS_REPOSITORY"
          echo "Artifact   : $ARTIFACT_NAME"
          echo "Version    : $VERSION"
          echo "========================================"

          curl \
            --fail \
            --show-error \
            --silent \
            --user "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --upload-file "$ARTIFACT_NAME" \
            "$UPLOAD_URL"

          echo "Nexus upload successful"

      - name: Nexus not configured
        if: steps.config.outputs.nexus_url == ''
        run: |
          echo "Nexus configuration not available from ForgeSphere"
          echo "Skipping Nexus upload"

      - name: End group Nexus Push
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # APIGEE TOKEN SERVICE AUTH
      # ===================================================

      - name: Start group Token auth
        run: echo "::group::Token auth"

      - name: Get Access Token
        id: token
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --write-out "\nHTTP_STATUS:%{http_code}\n" \
              "https://token-service-113875395623.us-central1.run.app/token"
          )"

          STATUS="$(
            echo "$RESPONSE" |
            grep HTTP_STATUS |
            cut -d':' -f2
          )"

          if [ "$STATUS" -ne 200 ]; then
            echo "ERROR: Failed to fetch Apigee access token"
            exit 1
          fi

          ACCESS_TOKEN="$(
            echo "$RESPONSE" |
            head -n 1 |
            jq -r '.access_token'
          )"

          if [ -z "$ACCESS_TOKEN" ] ||
             [ "$ACCESS_TOKEN" = "null" ]; then

            echo "ERROR: Invalid Apigee access token"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Apigee access token generated successfully"

      - name: End group Token auth
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # IMPORT
      # ===================================================

      - name: Start group Import
        run: echo "::group::Import"

      - name: Import Proxy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
          fi

          URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}?action=import&name=${{ inputs.deploy_proxy }}"

          TOKEN="${{ steps.token.outputs.access_token }}"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --write-out "\nHTTP_STATUS:%{http_code}\n" \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -F "file=@$ZIP_FILE" \
              "$URL"
          )"

          STATUS="$(
            echo "$RESPONSE" |
            grep HTTP_STATUS |
            cut -d':' -f2
          )"

          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Import successful"

      - name: End group Import
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # GET REVISION
      # ===================================================

      - name: Start group Revision
        run: echo "::group::Revision"

      - name: Get Latest Revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          REV="$(
            curl \
              --silent \
              --show-error \
              -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
              "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions" |
            jq -r 'map(tonumber) | max'
          )"

          if [ -z "$REV" ] || [ "$REV" = "null" ]; then
            echo "Unable to determine revision"
            exit 1
          fi

          echo "revision=$REV" >> "$GITHUB_OUTPUT"

          echo "Latest revision: $REV"

      - name: End group Revision
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # DEPLOY
      # ===================================================

      - name: Start group Deployment
        run: echo "::group::Deployment"

      - name: Deploy Proxy
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          SERVICE_ACCOUNT_FILE: ${{ steps.config.outputs.apigee_serviceAccountFile }}
        run: |
          set -euo pipefail
          BASE_URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments"
          TOKEN="${{ steps.token.outputs.access_token }}"
          
          if [ ! -f "$SERVICE_ACCOUNT_FILE" ]; then
            echo "ERROR: Apigee service account file not found:"
            echo "$SERVICE_ACCOUNT_FILE"
            exit 1
          fi
      
          SERVICE_ACCOUNT_EMAIL="$(
            jq -r '.client_email // empty' \
              "$SERVICE_ACCOUNT_FILE"
          )"
      
          if [ -z "$SERVICE_ACCOUNT_EMAIL" ]; then
            echo "ERROR: client_email missing from Apigee service account JSON"
            exit 1
          fi
      
          echo "Apigee service account: $SERVICE_ACCOUNT_EMAIL"
      
          # URL encode the service-account email.
          SERVICE_ACCOUNT_QUERY="$(
            printf '%s' "$SERVICE_ACCOUNT_EMAIL" |
            jq -sRr @uri
          )"
      
          URL="${BASE_URL}?serviceAccount=${SERVICE_ACCOUNT_QUERY}"
          BODY='{ "override": true }'

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --write-out "\nHTTP_STATUS:%{http_code}\n" \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "$BODY" \
              "$URL"
          )"

          STATUS="$(
            echo "$RESPONSE" |
            grep HTTP_STATUS |
            cut -d':' -f2
          )"

          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Deployment successful"

      - name: End group Deployment
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # VERIFY
      # ===================================================

      - name: Start group Verify
        run: echo "::group::Verify"

      - name: Verify Deployment
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
              "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}"
          )"

          if [ "$STATUS" != "200" ]; then
            echo "Proxy does not exist"
            exit 1
          fi
          echo "Proxy verified successfully"

      - name: End group Verify
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # CLEANUP
      # ===================================================

      - name: Cleanup CI/CD configuration
        if: always()
        shell: bash
        run: |
          rm -f \
            apigee-config.json \
            cicd-config.json \
            proxy.zip \
            sharedflowbundle.zip

          echo "Temporary configuration removed"
