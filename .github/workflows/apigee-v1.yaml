name: Reusable Apigee CI/CD (K8s Runner)

on:
  push:
    branches:
      - main

  workflow_call:
    inputs:
      apigee_org:
        required: true
        type: string
      apigee_env:
        required: true
        type: string
      deploy_proxy:
        required: true
        type: string
      resourcetype:
        required: true
        type: string
      node_version:
        required: false
        default: '18'
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      NEXUS_URL: 
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD: 
        required: true
      NEXUS_REPOSITORY: 
        required: true

permissions:
  contents: read

env:
  RESOURCE_TYPE: ${{ inputs.resourcetype }}
  BUNDLE_DIR: ${{ inputs.resourcetype == 'apis' && 'apiproxy' || 'sharedflowbundle' }}

jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Start group Setup
        run: echo "::group::Setup"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Force GitHub auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: "End group: Setup"
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # VALIDATE INPUT
      # -------------------------
      - name: "Start group: Validation"
        run: echo "::group::Validation"

      - name: Validate Resource Type
        run: |
          if [[ "${{ inputs.resourcetype }}" != "apis" && "${{ inputs.resourcetype }}" != "sharedflows" ]]; then
            echo "Invalid resourcetype: ${{ inputs.resourcetype }}"
            exit 1
          fi

      # -------------------------
      # OPTIONAL GITHUB APP TOKEN
      # -------------------------
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Select Token
        id: token-select
        shell: bash
        run: |
          TOKEN="${{ steps.app-token.outputs.token }}"
         
          if [ -n "$TOKEN" ]; then
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ secrets.GH_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi
          
      # -------------------------
      # Read Version from release.properties
      # -------------------------
      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          FINAL_VERSION="${VERSION}-${SHORT_SHA}"
          echo "VERSION=$FINAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
    
      # -------------------------
      # OPTIONAL LINT
      # -------------------------
      - name: "Start group: Lint"
        run: echo "::group::Lint"

      - name: Checkout lint rules
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ steps.token-select.outputs.token }}

      - name: Apigee Lint
        continue-on-error: true
        run: |
          if [ -d "./apigee-linting-custom" ]; then
            npx apigeelint -s "$BUNDLE_DIR" -x ./apigee-linting-custom/rules -f table.js || true
          else
            echo "Skipping lint"
          fi

      - name: JS Lint
        continue-on-error: true
        run: |
          npx jslint "$BUNDLE_DIR"/**/*.js || true

      - name: Sonar Scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonarqube-scanner \
            -Dsonar.organization=forgecrux \
            -Dsonar.projectKey=${{ github.event.repository.name }} \
            -Dsonar.sources="$BUNDLE_DIR" || true

      - name: "End group: Lint"
        if: always()
        run: echo "::endgroup::"
        
      # -------------------------
      # PACKAGE
      # -------------------------
      - name: "Start group: Package"
        run: echo "::group::Package"

      - name: Package Proxy
        shell: bash
        run: |
          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
          fi
      
          echo "RESOURCE_TYPE=$RESOURCE_TYPE"
          echo "BUNDLE_DIR=$BUNDLE_DIR"
          echo "ZIP_FILE=$ZIP_FILE"
      
          test -d "$BUNDLE_DIR"
      
          zip -r "$ZIP_FILE" "$BUNDLE_DIR"
      
          echo ""
          echo "========== ZIP CREATED =========="
          ls -lh "$ZIP_FILE"

      # ============================================================
      # NEXUS PUSH
      # ============================================================

      - name: Start group Nexus Push
        run: echo "::group::Nexus Push"

      - name: Push Package to Nexus
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
            ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
            ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Package not found: $ZIP_FILE"
            exit 1
          fi

          NEXUS_URL="${{ secrets.NEXUS_URL }}"
          NEXUS_REPOSITORY="${{ secrets.NEXUS_REPOSITORY }}"

          NEXUS_USERNAME="${{ secrets.NEXUS_USERNAME }}"
          NEXUS_PASSWORD="${{ secrets.NEXUS_PASSWORD }}"

          VERSION="${{ inputs.nexus_version }}-${GITHUB_SHA}"

          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_SHA}"
          fi

          UPLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${{ inputs.deploy_proxy }}/${VERSION}/${ARTIFACT_NAME}"

          echo "========================================"
          echo "NEXUS UPLOAD"
          echo "========================================"
          echo "Repository : $NEXUS_REPOSITORY"
          echo "Artifact   : $ARTIFACT_NAME"
          echo "Version    : $VERSION"
          echo "Package    : $ZIP_FILE"
          echo "========================================"

          curl \
            --fail \
            --show-error \
            --silent \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --upload-file "$ZIP_FILE" \
            "$UPLOAD_URL"

          echo ""
          echo "Nexus upload successful"


      - name: End group Nexus Push
        if: always()
        run: echo "::endgroup::"
        
      # -------------------------
      # TOKEN SERVICE AUTH
      # -------------------------
      - name: "Start group: Token auth"
        run: echo "::group::Token auth"

      - name: Get Access Token
        id: token
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            https://token-service-113875395623.us-central1.run.app/token)

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)

          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to fetch token"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$RESPONSE" | head -n 1 | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "Invalid token"
            exit 1
          fi

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: "End group: Token auth"
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # IMPORT
      # -------------------------
      - name: "Start group: Import"
        run: echo "::group::Import"

      - name: Import Proxy
        shell: bash
        run: |
          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
          fi
      
          URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}?action=import&name=${{ inputs.deploy_proxy }}"
      
          TOKEN="${{ steps.token.outputs.access_token }}"
      
          echo "================ REQUEST DEBUG ================"
          echo "URL:"
          echo "$URL"
          echo ""
      
          echo "RESOURCE TYPE:"
          echo "${{ inputs.resourcetype }}"
          echo ""
      
          echo "ORG:"
          echo "${{ inputs.apigee_org }}"
          echo ""
      
          echo "DEPLOY NAME:"
          echo "${{ inputs.deploy_proxy }}"
          echo ""
      
          echo "ZIP FILE:"
          echo "$ZIP_FILE"
          echo ""
      
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_FILE" || true
          echo ""
      
          echo "TOKEN PREVIEW:"
          echo "${TOKEN:0:25}..."
          echo "================================================"
          echo ""
      
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F file=@"$ZIP_FILE" \
            "$URL")
      
          echo ""
          echo "================ FULL RESPONSE ================="
          echo "$RESPONSE"
          echo "================================================"
          echo ""
      
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
      
          echo "PARSED STATUS: $STATUS"
      
          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            exit 1
          fi
      
          echo "Import successful"

      - name: "End group: Import"
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # GET REVISION
      # -------------------------
      - name: "Start group: Revision"
        run: echo "::group::Revision"

      - name: Get Latest Revision
        id: revision
        run: |
          REV=$(curl -s -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
          "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions" \
          | jq -r 'map(tonumber) | max')

          echo "revision=$REV" >> $GITHUB_OUTPUT

      - name: "End group: Revision"
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # DEPLOY
      # -------------------------
      - name: "Start group: Deployment"
        run: echo "::group::Deployment"

      - name: Deploy Proxy
        shell: bash
        run: |
          URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments"
      
          TOKEN="${{ steps.token.outputs.access_token }}"
      
          BODY='{ "override": true }'
      
          echo "================ REQUEST DEBUG ================"
          echo "URL:"
          echo "$URL"
          echo ""
      
          echo "RESOURCE TYPE:"
          echo "${{ inputs.resourcetype }}"
          echo ""
      
          echo "ORG:"
          echo "${{ inputs.apigee_org }}"
          echo ""
      
          echo "ENV:"
          echo "${{ inputs.apigee_env }}"
          echo ""
      
          echo "PROXY:"
          echo "${{ inputs.deploy_proxy }}"
          echo ""
      
          echo "REVISION:"
          echo "${{ steps.revision.outputs.revision }}"
          echo ""
      
          echo "REQUEST BODY:"
          echo "$BODY"
          echo ""
      
          echo "TOKEN PREVIEW:"
          echo "${TOKEN:0:25}..."
          echo "================================================"
          echo ""
      
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "$URL")
      
          echo ""
          echo "================ FULL RESPONSE ================="
          echo "$RESPONSE"
          echo "================================================"
          echo ""
      
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
      
          echo "PARSED STATUS: $STATUS"
      
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            exit 1
          fi
      
          echo "Deployment successful"

      - name: "End group: Deployment"
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # VERIFY
      # -------------------------
      - name: "Start group: Verify"
        run: echo "::group::Verify"

      - name: Verify Deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
              "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "Proxy does not exist"
            exit 1
          fi

          echo "Deployment successful"

      - name: "End group: Verify"
        if: always()
        run: echo "::endgroup::"
