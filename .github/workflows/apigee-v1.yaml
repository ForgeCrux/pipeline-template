name: Reusable Apigee CI/CD (K8s Runner)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

  workflow_call:
    inputs:
      apigee_org:
        required: true
        type: string
      apigee_env:
        required: true
        type: string
      deploy_proxy:
        required: true
        type: string
      node_version:
        required: false
        default: '18'
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      GCP_SA_KEY:
        required: true

permissions:
  contents: read

jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # Install tools
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          npm install -g apigeelint eslint jslint sonarqube-scanner

      # Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Create Service Account file
      - name: Create Service Account File
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > key.json

      # Authenticate using JSON key
      - name: Authenticate to GCP
        run: |
          gcloud auth activate-service-account --key-file=key.json

      # Generate Access Token
      - name: Get Access Token
        id: token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # GitHub Auth Fix
      - name: Force GitHub auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Generate GitHub App token
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Checkout lint rules
      - name: Checkout lint rules
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ steps.app-token.outputs.token }}

      # Apigee Lint (NON-BLOCKING)
      - name: Apigee Lint
        continue-on-error: true
        run: |
          apigeelint -s apiproxy -x ./apigee-linting-custom/rules -f table.js

      # JS Lint (NON-BLOCKING)
      - name: JS Lint
        continue-on-error: true
        run: |
          jslint apiproxy/**/*.js || true

      # Sonar Scan (NON-BLOCKING)
      - name: Sonar Scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.organization=forgecrux \
            -Dsonar.projectKey=${{ github.event.repository.name }} \
            -Dsonar.sources=apiproxy || true

      # Package Proxy
      - name: Package Proxy
        run: |
          test -d apiproxy
          zip -r proxy.zip apiproxy

      # Import Proxy
      - name: Import Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F file=@proxy.zip \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis?action=import&name=${{ inputs.deploy_proxy }}")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            exit 1
          fi

      # Get Revision
      - name: Get Latest Revision
        id: revision
        run: |
          REV=$(curl -s -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
          "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}/revisions" \
          | jq -r 'map(tonumber) | max')

          echo "revision=$REV" >> $GITHUB_OUTPUT

      # Deploy Proxy
      - name: Deploy Proxy
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data '{ "override": true }' \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/apis/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            exit 1
          fi

      # Verify
      - name: Verify Apigee proxy exists
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
              "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "Proxy does not exist"
            exit 1
          fi

          echo "Deployment successful"

      # Cleanup
      - name: Cleanup
        if: always()
        run: rm -f key.json
