name: Reusable Apigee CI/CD (K8s Runner)

on:
  push:
    branches:
      - main
      
  workflow_call:
    inputs:
      apigee_org:
        required: true
        type: string
      apigee_env:
        required: true
        type: string
      deploy_proxy:
        required: true
        type: string
      node_version:
        required: false
        default: '18'
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      GH_TOKEN:
        required: true
permissions:
  contents: read
  id-token: write   # REQUIRED for Workload Identity

jobs:
  build-lint-deploy:
    runs-on: [self-hosted, kubernetes, org-runner]
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP via Workload Identity
      - name: GCP Auth (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1076618220242/locations/global/workloadIdentityPools/forgecrux-pool/providers/github-provider
          service_account: gh-runner-gsa@methodical-mark-482504-j3.iam.gserviceaccount.com
          token_format: access_token

      # 3️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # 4️⃣ Cache npm
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ inputs.node_version }}

      # 5️⃣ Install tooling
      - name: Install tools
        run: |
          npm install -g apigeelint eslint jslint sonarqube-scanner
          echo "Github PAT" : ${{ secrets.GH_TOKEN }}
          echo "Sonar Token" :${{ secrets.SONAR_TOKEN }}

      #- name: Verify token access
      #  run: |
      #    curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
      #         https://api.github.com/repos/ForgeCrux/apigee-linting-custom

       # 6️⃣ Checkout lint rules
      - name: Checkout lint rules
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ secrets.GH_TOKEN }}
      
      # 6️⃣ Apigee Lint
      - name: Apigee Lint
        continue-on-error: true
        run: |
          apigeelint -s apiproxy -x ./apigee-linting-custom/rules -f table.js

      # 7️⃣ JavaScript Lint
      - name: JS Lint
        continue-on-error: true
        run: |
          set -e
          jslint apiproxy/**/*.js || true

      # 8️⃣ Sonar Scan
      - name: Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.organization=forgecrux \
            -Dsonar.projectKey=${{ github.event.repository.name }} \
            -Dsonar.sources=apiproxy

      # 9️⃣ Package Proxy
      - name: Package Proxy
        run: |
          test -d apiproxy
          zip -r proxy.zip apiproxy

      # 🔟 Import Proxy
      - name: Import Proxy
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -F file=@proxy.zip \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis?action=import&name=${{ inputs.deploy_proxy }}"

      # 1️⃣1️⃣ Get Latest Revision
      - name: Get Revision
        id: revision
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          REV=$(curl -i \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/apis/${{ inputs.deploy_proxy }}/revisions" \
            | jq -r '.[-1]')
          echo "revision=$REV" >> $GITHUB_OUTPUT

      # 1️⃣2️⃣ Deploy Proxy
      - name: Deploy Proxy
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/apis/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments"
