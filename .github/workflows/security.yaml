name: Security Apigee & Sonar Scan

on:
  workflow_dispatch:
    inputs:
      remote_repo:
        required: true
        type: string
      remote_branch:
        required: false
        default: main
        type: string
      apigee_path:
        required: false
        default: apiproxy
        type: string
      sonar_project_key:
        required: true
        type: string
      sonar_org:
        required: true
        type: string
    #secrets:
      sonar_token:
        required: true
      pat_token:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
  
jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout calling repo (optional)
      - name: Checkout current repo
        uses: actions/checkout@v4

      # 2️⃣ Checkout target remote repo
      - name: Checkout remote repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.remote_repo }}
          ref: ${{ inputs.remote_branch }}
          token: ${{ inputs.pat_token }}  # Must be PAT with repo scope
          path: target-repo

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4️⃣ Install ApigeeLint
      - name: Install ApigeeLint
        run: npm install -g apigeelint jslint

      # 5️⃣ Checkout custom lint rules
      - name: Checkout lint rules
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ secrets.pat_token }}

      # 6️⃣ Prepare scan-results folder
      - name: Prepare scan folder
        run: mkdir -p scan-results

      # 7️⃣ Run Apigee Lint
      - name: Apigee Lint
        continue-on-error: true
        run: |
          apigeelint -s target-repo/${{ inputs.apigee_path }} -x ./apigee-linting-custom/rules -f table.js > scan-results/apigeelint.txt || true

      # 8️⃣ Run JavaScript Lint
      - name: JS Lint
        continue-on-error: true
        run: |
          jslint target-repo/${{ inputs.apigee_path }}/**/*.js > scan-results/jslint.txt || true
      
      # 3️⃣ Install SonarScanner CLI
      - name: Install SonarScanner
        run: npm install -g sonarqube-scanner
  
      # 9️⃣ Run Sonar Scan
      - name: Run Sonar Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ inputs.sonar_project_key }} \
            -Dsonar.organization=${{ inputs.sonar_org }} \
            -Dsonar.sources=./target-repo \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ inputs.sonar_token }} \
            > scan-results/sonar.txt || true

      # 🔟 Combine all results
      - name: Combine results
        run: |
          cat scan-results/apigeelint.txt scan-results/jslint.txt scan-results/sonar.txt > scan-results/final-report.txt
          echo "Combined scan report created."

      # 1️⃣1️⃣ Upload artifact
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-results/
