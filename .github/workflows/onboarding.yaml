name: Onboarding Pipeline

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "New repository name"
        required: true
      resourcetype:
        required: true

env:
  ORG_NAME: ForgeCrux
  ZIP_URL: https://raw.githubusercontent.com/ProbeStack1/MigrationX_backend/main/data_edge/proxies/proxy-bundel.zip
  ZIP_FILE: proxy-bundel.zip

jobs:
  bootstrap-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Start group: Setup
        run: echo "::group::Setup"

      - name: 🧾 Set variables
        run: |
          echo "REPO_NAME=${{ inputs.repo_name }}" >> $GITHUB_ENV
          echo "WORKDIR=/tmp/${{ inputs.repo_name }}" >> $GITHUB_ENV

      # -------------------------
      # CREATE REPO
      # -------------------------
      - name: 🚀 Create repository
        run: |
          curl -s -X POST "https://api.github.com/orgs/${ORG_NAME}/repos" \
            -H "Authorization: token ${{ secrets.ORG_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{
              \"name\": \"${REPO_NAME}\",
              \"private\": false,
              \"auto_init\": true
            }"

      - name: ⏳ Wait for repo
        run: sleep 5

      - name: End group: Setup
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # INSTALL PYTHON + LIB
      # -------------------------
      - name: Start group: Dependency install
        run: echo "::group::Dependency install"

      - name: Install encryption dependencies
        run: |
          pip3 install pynacl

      - name: End group: Dependency install
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # GET PUBLIC KEY
      # -------------------------
      - name: Start group: Secrets
        run: echo "::group::Secrets"

      - name: 🔐 Get repo public key
        id: get_key
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.ORG_GITHUB_TOKEN }}" \
            https://api.github.com/repos/${ORG_NAME}/${REPO_NAME}/actions/secrets/public-key)

          echo "$RESPONSE"

          echo "key_id=$(echo $RESPONSE | jq -r .key_id)" >> $GITHUB_OUTPUT
          echo "key=$(echo $RESPONSE | jq -r .key)" >> $GITHUB_OUTPUT

      # -------------------------
      # ENCRYPT SECRET
      # -------------------------
      - name: 🔑 Encrypt secret
        id: encrypt
        run: |
          python3 - <<EOF
import base64
from nacl import public

public_key = "${{ steps.get_key.outputs.key }}"
secret = """${{ secrets.GCP_SA_KEY }}"""

pk = public.PublicKey(base64.b64decode(public_key))
sealed_box = public.SealedBox(pk)
encrypted = sealed_box.encrypt(secret.encode())

print("encrypted_value=" + base64.b64encode(encrypted).decode())
EOF >> $GITHUB_OUTPUT

      # -------------------------
      # CREATE SECRET (WITH DEBUG)
      # -------------------------
      - name: 🔒 Create secret
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X PUT \
            -H "Authorization: token ${{ secrets.ORG_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${ORG_NAME}/${REPO_NAME}/actions/secrets/GCP_SA_KEY \
            -d "{
              \"encrypted_value\": \"${{ steps.encrypt.outputs.encrypted_value }}\",
              \"key_id\": \"${{ steps.get_key.outputs.key_id }}\"
            }")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d':' -f2)

          if [ "$STATUS" -ne 201 ] && [ "$STATUS" -ne 204 ]; then
            echo "❌ Failed to create secret"
            exit 1
          fi

      # -------------------------
      # VERIFY SECRET EXISTS
      # -------------------------
      - name: 🔍 Verify secret
        run: |
          curl -H "Authorization: token ${{ secrets.ORG_GITHUB_TOKEN }}" \
          https://api.github.com/repos/${ORG_NAME}/${REPO_NAME}/actions/secrets

      - name: End group: Secrets
        if: always()
        run: echo "::endgroup::"

      # -------------------------
      # CLONE + ADD CODE
      # -------------------------
      - name: Start group: Bootstrap repo
        run: echo "::group::Bootstrap repo"

      - name: 📥 Clone repository
        run: |
          rm -rf "$WORKDIR"
          git clone https://x-access-token:${{ secrets.ORG_GITHUB_TOKEN }}@github.com/${ORG_NAME}/${REPO_NAME}.git "$WORKDIR"

      - name: ⬇️ Download ZIP
        run: |
          cd "$WORKDIR"
          curl -L -o "$ZIP_FILE" "$ZIP_URL"

      - name: 📦 Extract ZIP
        run: |
          cd "$WORKDIR"
          unzip "$ZIP_FILE"
          rm -f "$ZIP_FILE"

      - name: 📤 Commit and push
        run: |
          cd "$WORKDIR"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Bootstrap repository with proxy bundle"
          git branch -M main
          git push origin main

      - name: End group: Bootstrap repo
        if: always()
        run: echo "::endgroup::"
