apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
spec:
  replicas: ${REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: ${MAX_UNAVAILABLE}
      maxSurge: ${MAX_SURGE}
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
        - name: ${APP_NAME}
          image: ${ARTIFACT_REGISTRY}/${PROJECT_ID}/${ARTIFACT_REPO}/${APP_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: ${CONTAINER_PORT}
              protocol: TCP
          resources:
            requests:
              cpu: ${REQUEST_CPU}
              memory: ${REQUEST_MEMORY}
            limits:
              cpu: ${LIMIT_CPU}
              memory: ${LIMIT_MEMORY}
          livenessProbe:
            httpGet:
              path: ${LIVENESS_PATH}
              port: ${CONTAINER_PORT}
            initialDelaySeconds: ${LIVENESS_INITIAL_DELAY}
            timeoutSeconds: ${LIVENESS_TIMEOUT}
            periodSeconds: ${LIVENESS_PERIOD}
            failureThreshold: ${LIVENESS_FAILURE_THRESHOLD}
            successThreshold: ${LIVENESS_SUCCESS_THRESHOLD}
          readinessProbe:
            httpGet:
              path: ${READINESS_PATH}
              port: ${CONTAINER_PORT}
            initialDelaySeconds: ${READINESS_INITIAL_DELAY}
            timeoutSeconds: ${READINESS_TIMEOUT}
            periodSeconds: ${READINESS_PERIOD}
            failureThreshold: ${READINESS_FAILURE_THRESHOLD}
            successThreshold: ${READINESS_SUCCESS_THRESHOLD}
