apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.APP_NAME | default "react-vite" }}
  labels:
    app: {{ .Values.APP_NAME | default "react-vite" }}
spec:
  replicas: {{ .Values.REPLICAS | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.MAX_UNAVAILABLE | default "25%" }}
      maxSurge: {{ .Values.MAX_SURGE | default "25%" }}
  selector:
    matchLabels:
      app: {{ .Values.APP_NAME | default "react-vite" }}
  template:
    metadata:
      labels:
        app: {{ .Values.APP_NAME | default "react-vite" }}
    spec:
      containers:
        - name: {{ .Values.APP_NAME | default "react-vite" }}
          image: {{ .Values.IMAGE_REGISTRY }}/{{ .Values.PROJECT_ID }}/{{ .Values.ARTIFACT_REPO }}/{{ .Values.APP_NAME }}:{{ .Values.IMAGE_TAG }}
          ports:
            - containerPort: {{ .Values.CONTAINER_PORT | default 80 }}
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.REQUEST_CPU | default "100m" }}
              memory: {{ .Values.REQUEST_MEMORY | default "128Mi" }}
            limits:
              cpu: {{ .Values.LIMIT_CPU | default "500m" }}
              memory: {{ .Values.LIMIT_MEMORY | default "512Mi" }}
          livenessProbe:
            httpGet:
              path: {{ .Values.LIVENESS_PATH | default "/" }}
              port: {{ .Values.CONTAINER_PORT | default 80 }}
            initialDelaySeconds: {{ .Values.LIVENESS_INITIAL_DELAY | default 15 }}
            timeoutSeconds: {{ .Values.LIVENESS_TIMEOUT | default 1 }}
            periodSeconds: {{ .Values.LIVENESS_PERIOD | default 20 }}
            failureThreshold: {{ .Values.LIVENESS_FAILURE_THRESHOLD | default 3 }}
            successThreshold: {{ .Values.LIVENESS_SUCCESS_THRESHOLD | default 1 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.READINESS_PATH | default "/" }}
              port: {{ .Values.CONTAINER_PORT | default 80 }}
            initialDelaySeconds: {{ .Values.READINESS_INITIAL_DELAY | default 5 }}
            timeoutSeconds: {{ .Values.READINESS_TIMEOUT | default 1 }}
            periodSeconds: {{ .Values.READINESS_PERIOD | default 10 }}
            failureThreshold: {{ .Values.READINESS_FAILURE_THRESHOLD | default 3 }}
            successThreshold: {{ .Values.READINESS_SUCCESS_THRESHOLD | default 1 }}
